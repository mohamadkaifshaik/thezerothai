syntax = "proto3";

// Direct messages v1: 1:1, text only, pull plus push, no realtime channel, no end-to-end encryption (ADR-0027).
// Owner module: backend/internal/messaging. Collections owned: conversations/{convId}, its messages/{msgId}
// subcollection, and the per-user entries users/{uid}/dmInbox/{convId} and users/{uid}/dmRequests/{convId}. Only
// messaging.Service reads or writes them; firestore.rules stay deny-all to clients (ADR-0027 D1, D11).
//
// Who can message whom (ADR-0027 D4, founder decision F2): mutual follows land in the recipient's Inbox; everyone else
// lands in the recipient's Message requests (folder REQUESTS) until the recipient accepts or replies. Muted senders
// are delivered silently (no push, no unread increment; F9). Mentions and hashtags in a message are plain text: no
// notification, no tap-through (ADR-0027 D3). Messages are NOT end-to-end encrypted: the server holds the text.
//
// Ids (ADR-0027 D2): conversation_id and message id are opaque 32-character lower-case hex strings, NOT Snowflake
// ids. A conversation id is derived from the participant pair and is therefore guessable: authorization never relies
// on it. Every RPC that takes a conversation_id checks that the caller is a participant against the conversation doc.
// A conversation_id that is not 32 lower-case hex => INVALID_ARGUMENT + VALIDATION, metadata["field"] =
// "conversation_id", 0 reads. An unknown id, a conversation the caller is not a participant of and a deleted
// conversation answer ONE byte-identical NOT_FOUND after <= 2 reads (ADR-0027 D11). No response carries a sender uid:
// a Message has from_self, and the peer is Conversation.peer.
//
// Flag FEATURE_MESSAGING (wire name "messaging", default off; ADR-0027 D6, founder decision F6):
// - SendMessage and AcceptMessageRequest need it on for the caller (else FAILED_PRECONDITION + FEATURE_DISABLED,
//   metadata["feature"] = "messaging", 0 reads) AND for the recipient (else ERROR_REASON_CANNOT_MESSAGE, below).
// - ListConversations, ListMessages, MarkConversationRead and DeleteConversation need it only NOT GLOBALLY OFF, so a
//   user dropped from an allowlist can still read and clean up (ReportContent of a MESSAGE target likewise).
// - Globally off: every RPC is FEATURE_DISABLED with 0 reads; clients hide the destination, its routes and the
//   profile Message button. Clients learn the flag from IdentityService.GetMe enabled_features.
//
// Errors (clients branch on ErrorDetail.reason):
// - INVALID_ARGUMENT + VALIDATION, metadata["field"] in text | conversation_id | recipient_user_id | page_token |
//   since_token | idempotency_key (and folder, ListConversations only); 0 reads.
// - FAILED_PRECONDITION + FEATURE_DISABLED, metadata["feature"] = "messaging".
// - NOT_FOUND: one message for every cause (above).
// - FAILED_PRECONDITION + ERROR_REASON_CANNOT_MESSAGE: one reason, with identical bytes, for a block in either
//   direction, a recipient with messaging off, a recipient who is gone or not ACTIVE, and a conversation whose peer
//   deleted the account. It is no oracle beyond what GetProfile's NOT_FOUND already reveals.
// - FAILED_PRECONDITION + ERROR_REASON_LIMIT_REACHED, metadata["limit"] (limit_name) = "request_unanswered" (3 messages
//   until the recipient accepts) or "dm_new_daily" (new conversations per IST day).
// - RESOURCE_EXHAUSTED + RATE_LIMITED (per-minute buckets, the "messages_daily" cap and the per-uid daily read budget,
//   ADR-0010 D5); honour retry_after.
// - DEGRADED_MODE=readonly refuses the four mutations through the existing interceptor; the two lists still answer.
//
// Token contract for both lists (the ADR-0017 notifications codec, ADR-0027 D7; all tokens opaque):
// - First open: send neither token. Refresh (open, resume, a push received, a thread poll): send since_token from the
//   last response. Scroll older: send page_token (= next_page_token). Sending both tokens is INVALID_ARGUMENT.
// - since_token trails the newest item by a 5 s settle window, so a refresh may return items the client already has:
//   always dedupe by id and replace the old item.
// - Tokens are sealed, bound to the caller and the list (ListConversations: the folder; ListMessages: the
//   conversation) and the token kind, and expire after 30 days. An expired, foreign or tampered token =>
//   INVALID_ARGUMENT + VALIDATION, metadata["field"] = "since_token" or "page_token", 0 reads: drop it and call with
//   no token.
//
// Firestore budgets below are ADR-0027 "Cost impact" (per RPC). Worst-case reads include the account-status
// interceptor; every call is charged to the per-uid daily read budget (ADR-0010 D5, 2,000 reads/uid/day per instance).
// Keep them in sync with docs/reviews/cost-model.md.
package dzeroth.messaging.v1;

import "dzeroth/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/dzeroth/dzeroth/backend/gen/dzeroth/messaging/v1;messagingv1";

service MessagingService {
  // Send a text message, opening the conversation if needed. Target: recipient_user_id (opens or continues the 1:1
  // conversation with that user; self => VALIDATION "recipient_user_id"; [A-Za-z0-9-]{1,128}) or conversation_id (an
  // existing conversation the caller is a participant of, else NOT_FOUND).
  // text: the post grammar (NFC, <= 280 code points, <= 10 lines; testdata fixtures), validated before any read
  // (VALIDATION "text", 0 reads).
  // Flag: per caller AND per recipient. Caller off => FEATURE_DISABLED; recipient off => CANNOT_MESSAGE.
  // Refusals, all CANNOT_MESSAGE with identical bytes: either side blocks the other (the caller and recipient graph
  // snapshots, cached 60 s, so a new Block applies at once on its instance and within 60 s elsewhere; ADR-0027 A8),
  // the recipient is not ACTIVE or has messaging off, the conversation is gone (the peer deleted the account).
  // Routing: a new conversation is ACCEPTED when the two follow each other, else REQUEST (the recipient's entry goes
  // to REQUESTS). While REQUEST, the requester may send MESSAGES_REQUEST_MAX_UNANSWERED (3) messages, then
  // LIMIT_REACHED "request_unanswered"; a message from the recipient of the request accepts it (as on X). The
  // recipient muted the caller => delivered silently (no unread increment, no push).
  // Idempotency (ADR-0027 D2, the ADR-0021 bend of rules 1 and 4): the message id is derived from (caller,
  // idempotency_key) and Created in the send transaction, so a retry returns the stored message with 0 writes; the
  // same key with a different body => VALIDATION "idempotency_key". Clients dedupe by message id.
  // Caps (ADR-0027 D13): RATE_LIMIT_MESSAGES_SEND_PER_MIN 20/min/uid per instance (60/min at 3 instances);
  // MESSAGES_SENDS_PER_DAY 300 (50 for new accounts) per instance (<= 900/day at 3) => RATE_LIMITED metadata["limit"]
  // = "messages_daily"; QUOTA_DM_NEW_CONVERSATIONS_PER_DAY 20 new conversations per IST day (5 for new accounts),
  // exact (quotas/{uid}.dmNew, in the transaction) => LIMIT_REACHED "dm_new_daily"; MESSAGES_REQUEST_MAX_UNANSWERED 3,
  // exact (conversations.requestCount, in the transaction).
  // Push: after the commit one `message` event through notifications.Emitter (one Pub/Sub publish, 0 Firestore on
  // this path), only when the recipient's side is accepted and not silent; a request never pushes. The push is
  // generic ("New message") and carries only the conversation id (NOTIFICATION_TYPE_MESSAGE).
  // Firestore (ADR-0027 Cost impact): accepted conversation reads 5 worst cold (interceptor, caller graph, recipient
  // graph, recipient users via the directory, conversation doc in the transaction), planning 2.5; writes 3 (message,
  // 2 entries), 4 while REQUEST (+ requestCount). New conversation reads 7 worst (+ fresh recipient status, quotas),
  // writes 5 (message, conversation, 2 entries, quotas.dmNew). Replay +1 read (the stored message), 0 writes.
  // Refused <= 5 reads, 0 writes; a validation rejection 0 reads. Deletes 0.
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);

  // The caller's conversations in one folder, most recent activity first. The path comes from the caller's token;
  // there is no user id parameter. folder must be INBOX or REQUESTS, else VALIDATION "folder".
  // Read-time rules (caller graph, cached 60 s): REQUESTS drops entries whose peer the caller blocks or mutes, or who
  // blocks the caller; INBOX keeps every entry, with can_reply = false when either side blocks. Filtering runs after
  // the page query, so a page may be short or empty while next_page_token is non-empty: keep following it.
  // request_count is set on the first INBOX page only (no token); 0 everywhere else.
  // There is no gap_page_token here (plan W7-2): a since refresh returns at most page_size entries.
  // Flag: not globally off. Rate limit: RATE_LIMIT_MESSAGES_READ_PER_MIN 30/min/uid per instance (90/min at 3),
  // shared with ListMessages.
  // Firestore: first INBOX page 20: reads 23 worst cold (interceptor, query 20, caller graph, requests count()),
  // planning 9; REQUESTS the same without the count(). since refresh reads 3 worst (interceptor, query min 1, caller
  // graph), planning 2. Writes 0.
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Messages of one conversation, newest first. Messages at or before the caller's own DeleteConversation time are
  // not returned. Tombstones (state DELETED_ACCOUNT or REMOVED) are returned with empty text.
  // conversation is set on a first or older page (live peer snapshot from the identity directory, 60 s; can_reply
  // from the caller graph, 60 s) and UNSET on a since response, so a poll reads no peer profile or graph.
  // A since refresh whose page was full returns gap_page_token: keep the cache and fill the gap with page_token =
  // gap_page_token (bounded below by the old since_token).
  // Client polling (ADR-0027 D7): only on a visible thread; web 15 s while hot, Android 30 s while hot, 45 s while
  // quiet, stopped after 5 min idle or when hidden; a push for the conversation triggers an immediate pull; a
  // RATE_LIMITED answer pauses polling.
  // Flag: not globally off. Rate limit: RATE_LIMIT_MESSAGES_READ_PER_MIN 30/min/uid per instance (90/min at 3),
  // shared with ListConversations.
  // Firestore: first or older page 20 / 50: reads 24 / 54 worst cold (interceptor, conversation, query, peer users,
  // caller graph for can_reply), planning 15. since poll: reads 3 cold (interceptor, conversation, query min 1)
  // + 1 per new message returned, planning 1.2. NOT_FOUND after <= 2 reads. Writes 0.
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Marks the conversation read for the caller: unread count 0 and the read time on the caller's own entry (a field
  // update with an Exists precondition). The read time is never shown to the peer (no read receipts, F4). A missing
  // entry (unknown id, non-participant, deleted for the caller) => success, 0 writes. Evicts the caller's
  // unread_conversation_count cache on this instance. Call only when the client holds unread_count > 0.
  // Flag: not globally off. Refused under DEGRADED_MODE=readonly.
  // Firestore: reads 1 (interceptor), planning 0.3; writes 1 (0 when the entry is missing); deletes 0.
  rpc MarkConversationRead(MarkConversationReadRequest) returns (MarkConversationReadResponse);

  // Accepts a message request: the conversation becomes ACCEPTED and the caller's entry moves from REQUESTS to INBOX
  // (unread count kept). Only the recipient of the request may accept; the requester (or a non-participant) gets
  // NOT_FOUND. Already accepted => success, 0 writes. Emits nothing.
  // Flag: per caller AND per recipient (the peer); peer off => CANNOT_MESSAGE. Refused under DEGRADED_MODE=readonly.
  // Firestore: reads 3 worst (interceptor, conversation, request entry), planning 2.5; writes 2 (conversation state,
  // dmInbox entry); deletes 1 (dmRequests entry).
  rpc AcceptMessageRequest(AcceptMessageRequestRequest) returns (AcceptMessageRequestResponse);

  // Deletes the conversation for the caller only (also "delete request"): removes the caller's entry from either
  // folder and hides every message up to now from the caller. The peer keeps the conversation. A deleted request stays
  // a REQUEST for the sender, whose cap still applies; a later message recreates the caller's entry showing only newer
  // messages. Blocking from a thread uses GraphService.Block and does not delete the conversation.
  // Flag: not globally off. Refused under DEGRADED_MODE=readonly.
  // Firestore: reads 3 worst, planning 2.5; writes 1 (clearedAt on the conversation); deletes 1 (the caller's entry).
  rpc DeleteConversation(DeleteConversationRequest) returns (DeleteConversationResponse);
}

// Additive: a group conversation would be a new value (ADR-0027 stage ladder).
enum ConversationKind {
  CONVERSATION_KIND_UNSPECIFIED = 0;
  // 1:1 between the caller and Conversation.peer.
  CONVERSATION_KIND_DIRECT = 1;
}

enum ConversationState {
  CONVERSATION_STATE_UNSPECIFIED = 0;
  // A request from a non-mutual that the recipient has not accepted yet (capped at 3 messages from the requester).
  CONVERSATION_STATE_REQUEST = 1;
  CONVERSATION_STATE_ACCEPTED = 2;
}

// Where the caller's entry for a conversation lives. Additive (an archived folder would be a new value).
enum Folder {
  FOLDER_UNSPECIFIED = 0;
  // Accepted conversations, and requests the caller sent.
  FOLDER_INBOX = 1;
  // Message requests the caller received and has not accepted.
  FOLDER_REQUESTS = 2;
}

enum MessageState {
  MESSAGE_STATE_UNSPECIFIED = 0;
  MESSAGE_STATE_VISIBLE = 1;
  // The sender deleted the account; text is empty. Render "Message deleted".
  MESSAGE_STATE_DELETED_ACCOUNT = 2;
  // Taken down by a moderator; text is empty.
  MESSAGE_STATE_REMOVED = 3;
}

message Conversation {
  // 32 lower-case hex, opaque.
  string id = 1;
  ConversationKind kind = 2;
  // The other participant. From the caller's entry (refreshed on every message either way) in ListConversations, and
  // live from the identity directory (60 s) in ListMessages. A peer who deleted the account reads "Deleted account".
  dzeroth.common.v1.AuthorSnapshot peer = 3;
  ConversationState state = 4;
  // The folder of the caller's entry.
  Folder folder = 5;
  MessagePreview last_message = 6;
  // Unread messages for the caller. Does not grow while silent.
  int64 unread_count = 7;
  // False when either side blocks the other or the peer deleted the account: the thread is read-only but can still be
  // reported. Show no composer.
  bool can_reply = 8;
  // True when the caller muted the peer: messages arrive without a push or an unread increment (F9).
  bool silent = 9;
  // Last activity on the caller's entry; the ListConversations sort key.
  google.protobuf.Timestamp updated_at = 10;
}

// The last message of a conversation as shown in the list.
message MessagePreview {
  // At most 100 code points of the text; empty for a tombstone.
  string snippet = 1;
  // True when the caller sent it (render "You: ").
  bool from_self = 2;
  MessageState state = 3;
  google.protobuf.Timestamp created_at = 4;
}

message Message {
  // 32 lower-case hex, opaque; derived from the sender and the idempotency_key. Dedupe by it.
  string id = 1;
  string conversation_id = 2;
  // True when the caller sent it. There is deliberately no sender uid: the peer is Conversation.peer.
  bool from_self = 3;
  // NFC, the post grammar. Empty unless state is VISIBLE.
  string text = 4;
  MessageState state = 5;
  // Server time of the send; the sort key (newest first).
  google.protobuf.Timestamp created_at = 6;
  // Held for future images in messages (founder decision F1: text only in v1; ADR-0027 stage ladder "Images in
  // messages"). Never reuse it for anything else.
  reserved 7;
}

message SendMessageRequest {
  string idempotency_key = 1;
  oneof target {
    // An existing conversation (32 lower-case hex) the caller is a participant of.
    string conversation_id = 2;
    // Open or continue the 1:1 conversation with this user. [A-Za-z0-9-]{1,128}; not the caller.
    string recipient_user_id = 3;
  }
  // NFC, <= 280 code points, <= 10 lines (the post grammar).
  string text = 4;
}

message SendMessageResponse {
  Message message = 1;
  Conversation conversation = 2;
}

message ListConversationsRequest {
  // INBOX or REQUESTS.
  Folder folder = 1;
  // 0 => 20; max 50 (clamped).
  int32 page_size = 2;
  string page_token = 3;
  string since_token = 4;
}

message ListConversationsResponse {
  // Most recent activity first.
  repeated Conversation conversations = 1;
  // "" => no older conversations.
  string next_page_token = 2;
  // Persist with the cached list; send on the next refresh.
  string since_token = 3;
  // Pending message requests ("Message requests (N)"): set on the first INBOX page only, else 0.
  int64 request_count = 4;
}

message ListMessagesRequest {
  string conversation_id = 1;
  // 0 => 20; max 50 (clamped).
  int32 page_size = 2;
  string page_token = 3;
  string since_token = 4;
}

message ListMessagesResponse {
  // Newest first.
  repeated Message messages = 1;
  // Set on a first or older page; UNSET on a since response (keep the cached one).
  Conversation conversation = 2;
  // "" => no older messages.
  string next_page_token = 3;
  // Persist with the cached messages; send on the next poll.
  string since_token = 4;
  // Non-empty => a refresh gap exists below the returned messages (see the token contract).
  string gap_page_token = 5;
}

message MarkConversationReadRequest {
  string idempotency_key = 1;
  string conversation_id = 2;
}

message MarkConversationReadResponse {}

message AcceptMessageRequestRequest {
  string idempotency_key = 1;
  string conversation_id = 2;
}

message AcceptMessageRequestResponse {}

message DeleteConversationRequest {
  string idempotency_key = 1;
  string conversation_id = 2;
}

message DeleteConversationResponse {}
