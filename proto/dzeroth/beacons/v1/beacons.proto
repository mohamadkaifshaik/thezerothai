syntax = "proto3";

// Beacons ("Plans"): a concrete, time-boxed invitation to do one activity together ("Coffee, campus food court,
// 4 PM, 25 minutes, 3 spots, everyone pays their own") inside one community or publicly, with request-to-join and
// organiser acceptance (docs/beacons-plan.md). Owner module: backend/internal/beacons.
// Collections owned: beacons/{beaconId} (organiserId, communityId, activity, title, details, venue, startAt, endAt,
// durationMin, openSpots, acceptedCount, cost, chatPref, eligibility, status, hidden, createdAt, updatedAt,
// expireAt), beacons/{beaconId}/beaconParticipants/{uid} (uid, state, note, requestedAt, respondedAt, expireAt) and
// users/{uid}/beaconMemberships/{beaconId} (beaconId, role, state, pendingUntil, communityId, startAt, endAt; never another
// user's uid, so a row may outlive an erased organiser's beacon and is dropped on read). Only beacons.Service reads or
// writes them; firestore.rules stay deny-all to clients.
//
// Ids: beacon_id is a 64-bit Snowflake rendered as a 19-digit decimal string (rule 1). It is time-ordered and
// therefore guessable, so authorization never relies on it. A beacon_id that is not 19 digits => INVALID_ARGUMENT +
// VALIDATION, metadata["field"] = "beacon_id", before any lookup.
//
// Audience: a beacon is scoped to one community (community_id; the caller must be a JOINED member, and
// FEATURE_COMMUNITIES must be on for the caller) or public. Community beacons are returned only to JOINED members
// (owner and moderators included, banned users excluded); public beacons to anyone with the flag. A beacon whose
// organiser blocks the caller, or whom the caller blocks, is NOT_FOUND to that caller and absent from every list,
// byte-identical to a missing id. A beacon hidden by the platform (opsctl) is visible to its organiser only.
//
// Lifecycle: OPEN -> FULL when accepted_count reaches open_spots, back to OPEN on a leave or removal; CANCELLED by
// the organiser at any time; ENDED is derived at read time (now >= start_at + duration_minutes) and never stored.
// Every mutation on an ENDED or CANCELLED beacon => FAILED_PRECONDITION, metadata["reason"] = "ended" | "cancelled",
// with two idempotent exceptions that succeed and write only the idempotency doc: CancelBeacon on an already-CANCELLED
// beacon, and RequestToJoin by a caller who is already ACCEPTED (see each RPC).
//
// Participation: RequestToJoin -> the organiser's RespondToJoinRequest (ACCEPT | DECLINE) -> LeaveBeacon (always
// allowed, no approval) or the organiser's RemoveParticipant. Mutual acceptance is the only path in. The organiser
// is never a participant row. Eligibility is EVERYONE at v1 (docs/beacons-plan.md D4).
//
// Flag FEATURE_BEACONS (wire name "beacons", default off): CreateBeacon, UpdateBeacon, RequestToJoin and
// RespondToJoinRequest need it on for the caller; every other RPC only needs it not globally off, so a caller dropped
// from an allowlist can still read, leave and cancel. Else FAILED_PRECONDITION + FEATURE_DISABLED,
// metadata["feature"] = "beacons", before any lookup. Clients learn it from IdentityService.GetMe enabled_features.
//
// Idempotency (rule 4): every mutation takes idempotency_key (16-64 characters of [A-Za-z0-9_-], else VALIDATION
// "idempotency_key", before any lookup) and stores the standard TTL'd idempotency/{sha256(uid|rpc|key)} document
// (24 h) in the same transaction as its effect. A retry with the same key returns the stored outcome and writes
// nothing; the same key with a different request body => INVALID_ARGUMENT + IDEMPOTENCY_KEY_REUSED.
//
// Text fields: title 1-60, details 0-300, venue 1-80 and note 0-140 code points after NFC and trim; single line, no
// control or bidi formatting characters (the bio rules); else VALIDATION naming the field, before any lookup.
//
// Errors (clients branch on ErrorDetail.reason):
// - INVALID_ARGUMENT + VALIDATION, metadata["field"] in beacon_id | user_id | community_id | audience | activity |
//   title | details | venue | start_at | duration_minutes | open_spots | cost | chat_preference | note | response |
//   page_token | idempotency_key; before any lookup. limit is never a validation error: it is clamped (0 = 20, above
//   50 = 50), the lists precedent.
// - FAILED_PRECONDITION + FEATURE_DISABLED, metadata["feature"] = "beacons" (or "communities" for a community
//   audience while that flag is off for the caller).
// - NOT_FOUND: one message for a missing, hidden, blocked or not-visible beacon (including a community audience whose
//   community is missing or SUSPENDED; the community owner still reads a SUSPENDED community's beacons).
// - FAILED_PRECONDITION + COMMUNITY_STATE, metadata["reason"] = "community_archived": CreateBeacon, RequestToJoin or
//   an ACCEPT in an ARCHIVED community (read-only); nothing is written.
// - FORBIDDEN, metadata["reason"] = "not_member" (community audience, caller not JOINED) | "not_organiser"
//   (UpdateBeacon, CancelBeacon, RespondToJoinRequest, RemoveParticipant, ListParticipants REQUESTED by anyone
//   else). A block in either direction is never FORBIDDEN: it is the one NOT_FOUND above.
// - FAILED_PRECONDITION, metadata["reason"] = "full" | "ended" | "cancelled" | "already_requested" |
//   "not_requested" | "not_participant" | "organiser" (the organiser asked to join their own beacon) | "started"
//   (UpdateBeacon changing start_at, duration_minutes or cost once the beacon has started).
// - FAILED_PRECONDITION + LIMIT_REACHED, metadata["limit"] = "beacons_open" (BEACONS_MAX_OPEN_PER_USER, 5 OPEN or
//   FULL beacons per organiser) | "beacon_requests_pending" (BEACONS_MAX_PENDING_REQUESTS, 10 REQUESTED rows per
//   user) | "beacon_participants" (open_spots above BEACONS_MAX_OPEN_SPOTS, 20) | "beacon_edit_rows" (UpdateBeacon
//   rescheduling a beacon with more than 200 participant rows, every state; a bound on the one transaction that moves
//   them); nothing is written.
// - RESOURCE_EXHAUSTED + RATE_LIMITED: RATE_LIMIT_BEACONS_WRITE_PER_MIN (10: Create, Update, Cancel),
//   RATE_LIMIT_BEACONS_ACTION_PER_MIN (20: Request, Withdraw, Respond, Leave, Remove), RATE_LIMIT_BEACONS_READ_PER_MIN
//   (30: Get, List*) per uid per instance, and the daily cap BEACONS_CREATED_PER_DAY (10, limit_name
//   "beacons_created_daily"); honour retry_after.
// - DEGRADED_MODE=readonly refuses every mutation through the existing interceptor; the reads still answer.
package dzeroth.beacons.v1;

import "dzeroth/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/dzeroth/dzeroth/backend/gen/dzeroth/beacons/v1;beaconsv1";

service BeaconService {
  // Create a beacon organised by the caller. audience: community_id (the caller must be a JOINED member) or
  // public = true; neither or both => VALIDATION "audience". activity != UNSPECIFIED; start_at in [now + 5 min,
  // now + 30 d]; duration_minutes 15-240; open_spots 1..BEACONS_MAX_OPEN_SPOTS; cost and chat_preference !=
  // UNSPECIFIED. Text rules in the header. One transaction: idempotency doc, a count() of the caller's OPEN/FULL
  // beacons (LIMIT_REACHED "beacons_open" at 5), the beacon doc with a fresh Snowflake id (status OPEN,
  // accepted_count 0, eligibility EVERYONE) and the caller's beaconMemberships row (role ORGANISER).
  rpc CreateBeacon(CreateBeaconRequest) returns (CreateBeaconResponse);
  // Change title, details, venue, open_spots, start_at, duration_minutes or cost of one of the caller's OPEN or FULL
  // beacons (any other caller => FORBIDDEN "not_organiser"). open_spots may not go below accepted_count (VALIDATION
  // "open_spots"); raising it turns FULL back into OPEN, lowering it to accepted_count turns OPEN into FULL.
  // start_at, duration_minutes and cost follow the CreateBeacon rules (start_at in [now + 5 min, now + 30 d],
  // duration_minutes 15-240, cost != UNSPECIFIED; else VALIDATION naming the field, before any lookup) and can only
  // change before the beacon starts (now < the stored start_at, else FAILED_PRECONDITION "started"; resending the
  // stored value is not a change). A new start_at or duration moves end, the TTL (expireAt) of the beacon and of every
  // participant row, and start/end of every membership row, in the one transaction (at most 200 participant rows, else
  // LIMIT_REACHED "beacon_edit_rows"). A change of any of the three keeps every participant as they are (accepted
  // people stay and may LeaveBeacon) and notifies the ACCEPTED participants once per edit
  // (NOTIFICATION_TYPE_BEACON_UPDATED). The audience stays immutable: cancel and create again. A request that changes
  // nothing writes only the idempotency doc.
  rpc UpdateBeacon(UpdateBeaconRequest) returns (UpdateBeaconResponse);
  // Cancel one of the caller's OPEN or FULL beacons: status CANCELLED on the beacon only. Participant and membership
  // rows are pointers and read the beacon's status (GetBeacon, ListMyBeacons), so nothing fans out. Participants are
  // notified (NOTIFICATION_TYPE_BEACON_CANCELLED). Already CANCELLED => success with the idempotency doc only.
  rpc CancelBeacon(CancelBeaconRequest) returns (CancelBeaconResponse);
  // One beacon as the caller may see it (audience, blocks and hidden applied; header). The organiser row is live
  // (identity directory, 60 s); the viewer state is computed from the caller's participant row (1 read).
  rpc GetBeacon(GetBeaconRequest) returns (GetBeaconResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // OPEN and FULL beacons of one audience whose start_at >= from (default now), soonest first. Hidden beacons and
  // beacons across a block with the caller are dropped (the caller's graph snapshot, 60 s). A community audience
  // needs the caller JOINED (FORBIDDEN "not_member"). limit is clamped (0 = 20, above 50 = 50); page_token is an
  // opaque signed cursor bound to the caller and the audience, VALIDATION "page_token" when invalid or expired.
  rpc ListBeacons(ListBeaconsRequest) returns (ListBeaconsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The caller's own beacons: organised, requested or accepted (role filter), UPCOMING (start_at + duration >= now,
  // soonest first) or PAST (most recent first), from users/{uid}/beaconMemberships. A CANCELLED beacon keeps its window
  // and renders status CANCELLED. Rows that ended in DECLINED, WITHDRAWN, LEFT or REMOVED, rows whose beacon is gone or
  // hidden, and rows across a block with the organiser are left out (a page may be short while next_page_token is
  // set). limit is clamped (0 = 20, above 50 = 50).
  rpc ListMyBeacons(ListMyBeaconsRequest) returns (ListMyBeaconsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Ask to join an OPEN beacon the caller may see. The organiser may not join their own beacon
  // (FAILED_PRECONDITION "organiser"). note 0-140 code points. A REQUESTED row
  // already there => FAILED_PRECONDITION "already_requested"; an ACCEPTED one => success with the idempotency doc
  // only; a DECLINED, WITHDRAWN, LEFT or REMOVED row may request again. At
  // BEACONS_MAX_PENDING_REQUESTS (10) REQUESTED rows for the caller => LIMIT_REACHED "beacon_requests_pending". A
  // FULL beacon => FAILED_PRECONDITION "full". The organiser is notified (NOTIFICATION_TYPE_BEACON_REQUEST).
  rpc RequestToJoin(RequestToJoinRequest) returns (RequestToJoinResponse);
  // Withdraw the caller's REQUESTED row (state WITHDRAWN), on a live, ENDED or CANCELLED beacon alike, so a stale
  // request can always be cleared (it stops counting toward beacon_requests_pending once its beacon ended anyway). The
  // only gate is the caller's own row: a block, a hidden beacon or a community the caller left never prevents it. No
  // row => NOT_FOUND (the one message above); any other state => FAILED_PRECONDITION "not_requested".
  rpc WithdrawJoinRequest(WithdrawJoinRequestRequest) returns (WithdrawJoinRequestResponse);
  // The organiser accepts or declines one REQUESTED row (any other caller => FORBIDDEN "not_organiser"; a row in any
  // other state => FAILED_PRECONDITION "not_requested"). ACCEPT runs in one transaction with the beacon doc: when
  // accepted_count == open_spots the answer is FAILED_PRECONDITION "full" and nothing is written; otherwise the row
  // becomes ACCEPTED, accepted_count grows and the beacon turns FULL when it reaches open_spots. The requester is
  // notified on ACCEPT only (NOTIFICATION_TYPE_BEACON_ACCEPTED).
  rpc RespondToJoinRequest(RespondToJoinRequestRequest) returns (RespondToJoinRequestResponse);
  // Leave a beacon the caller is ACCEPTED on (state LEFT; accepted_count shrinks and a FULL beacon turns OPEN).
  // Always allowed, never needs approval: the only gate is the caller's own row (a block, a hidden beacon or a
  // community the caller left never prevents it). No row => NOT_FOUND (the one message above, even on an ENDED or
  // CANCELLED beacon); ENDED or CANCELLED => "ended" | "cancelled"; not ACCEPTED => FAILED_PRECONDITION
  // "not_participant".
  rpc LeaveBeacon(LeaveBeaconRequest) returns (LeaveBeaconResponse);
  // The organiser removes an ACCEPTED participant (state REMOVED; same count rules as LeaveBeacon). Any other caller
  // => FORBIDDEN "not_organiser"; not ACCEPTED => FAILED_PRECONDITION "not_participant".
  rpc RemoveParticipant(RemoveParticipantRequest) returns (RemoveParticipantResponse);
  // ACCEPTED participants (visible to the organiser and to ACCEPTED participants; anyone else => NOT_FOUND) or, for
  // the organiser only, REQUESTED rows with their notes (anyone else => FORBIDDEN "not_organiser"). Live rows
  // (identity directory, 60 s), oldest first. A participant does not see peers across a block in either direction
  // (the organiser sees everyone), so a page may hold fewer rows than accepted_count. limit is clamped (0 = 20, above
  // 50 = 50).
  rpc ListParticipants(ListParticipantsRequest) returns (ListParticipantsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

enum BeaconActivity {
  BEACON_ACTIVITY_UNSPECIFIED = 0;
  BEACON_ACTIVITY_COFFEE = 1;
  BEACON_ACTIVITY_MEAL = 2;
  BEACON_ACTIVITY_STUDY = 3;
  BEACON_ACTIVITY_SPORTS = 4;
  BEACON_ACTIVITY_WALK = 5;
  BEACON_ACTIVITY_SHOPPING = 6;
  BEACON_ACTIVITY_OTHER = 7;
}

enum BeaconStatus {
  BEACON_STATUS_UNSPECIFIED = 0;
  BEACON_STATUS_OPEN = 1;
  BEACON_STATUS_FULL = 2;
  BEACON_STATUS_CANCELLED = 3;
  // Derived at read time: now >= start_at + duration_minutes. Never stored.
  BEACON_STATUS_ENDED = 4;
}

enum BeaconCost {
  BEACON_COST_UNSPECIFIED = 0;
  BEACON_COST_FREE = 1;
  BEACON_COST_EVERYONE_PAYS_OWN = 2;
  BEACON_COST_SPLIT_EVENLY = 3;
}

// An expectation shown on the beacon, never enforced: people may change it or leave at any time.
enum ChatPreference {
  CHAT_PREFERENCE_UNSPECIFIED = 0;
  CHAT_PREFERENCE_QUIET = 1;
  CHAT_PREFERENCE_TASK_FOCUSED = 2;
  CHAT_PREFERENCE_OPEN_TO_CHAT = 3;
}

// Who may request to join. Only EVERYONE exists at v1 (docs/beacons-plan.md D4); a restricted value needs a profile
// field and its own ADR.
enum BeaconEligibility {
  BEACON_ELIGIBILITY_UNSPECIFIED = 0;
  BEACON_ELIGIBILITY_EVERYONE = 1;
}

enum ParticipantState {
  PARTICIPANT_STATE_UNSPECIFIED = 0;
  PARTICIPANT_STATE_REQUESTED = 1;
  PARTICIPANT_STATE_ACCEPTED = 2;
  PARTICIPANT_STATE_DECLINED = 3;
  PARTICIPANT_STATE_WITHDRAWN = 4;
  PARTICIPANT_STATE_LEFT = 5;
  PARTICIPANT_STATE_REMOVED = 6;
}

enum ViewerRole {
  VIEWER_ROLE_UNSPECIFIED = 0;
  VIEWER_ROLE_NONE = 1;
  VIEWER_ROLE_ORGANISER = 2;
  VIEWER_ROLE_PARTICIPANT = 3;
}

enum JoinResponse {
  JOIN_RESPONSE_UNSPECIFIED = 0;
  JOIN_RESPONSE_ACCEPT = 1;
  JOIN_RESPONSE_DECLINE = 2;
}

enum MyBeaconsRole {
  // Same as ALL.
  MY_BEACONS_ROLE_UNSPECIFIED = 0;
  MY_BEACONS_ROLE_ALL = 1;
  MY_BEACONS_ROLE_ORGANISER = 2;
  MY_BEACONS_ROLE_PARTICIPANT = 3;
}

enum MyBeaconsWindow {
  // Same as UPCOMING.
  MY_BEACONS_WINDOW_UNSPECIFIED = 0;
  MY_BEACONS_WINDOW_UPCOMING = 1;
  MY_BEACONS_WINDOW_PAST = 2;
}

enum ParticipantFilter {
  // Same as ACCEPTED.
  PARTICIPANT_FILTER_UNSPECIFIED = 0;
  PARTICIPANT_FILTER_ACCEPTED = 1;
  // Organiser only.
  PARTICIPANT_FILTER_REQUESTED = 2;
}

message Beacon {
  // 19-digit Snowflake.
  string beacon_id = 1;
  // Live row (identity directory, up to 60 s stale).
  dzeroth.common.v1.AuthorSnapshot organiser = 2;
  // Empty for a public beacon.
  string community_id = 3;
  BeaconActivity activity = 4;
  // 1-60 code points.
  string title = 5;
  // 0-300 code points.
  string details = 6;
  // 1-80 code points: a named meeting point, never coordinates.
  string venue = 7;
  google.protobuf.Timestamp start_at = 8;
  // 15-240.
  int32 duration_minutes = 9;
  // Seats beyond the organiser, 1..BEACONS_MAX_OPEN_SPOTS.
  int32 open_spots = 10;
  int32 accepted_count = 11;
  BeaconCost cost = 12;
  ChatPreference chat_preference = 13;
  BeaconEligibility eligibility = 14;
  BeaconStatus status = 15;
  // Platform hide (opsctl). Only ever true in the organiser's own view.
  bool hidden = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
}

// The caller's relationship with a beacon, so the client renders the right action without a second call.
message ViewerState {
  ViewerRole role = 1;
  // UNSPECIFIED when the viewer never requested.
  ParticipantState participant_state = 2;
  bool can_request = 3;
  bool can_withdraw = 4;
  bool can_leave = 5;
  bool can_manage = 6;
}

message BeaconView {
  Beacon beacon = 1;
  ViewerState viewer = 2;
}

message Participant {
  // Live row (identity directory, up to 60 s stale).
  dzeroth.common.v1.AuthorSnapshot user = 1;
  ParticipantState state = 2;
  // REQUESTED rows only, organiser only; empty otherwise.
  string note = 3;
  // requestedAt for a REQUESTED row, respondedAt for an ACCEPTED one.
  google.protobuf.Timestamp since = 4;
}

message CreateBeaconRequest {
  string idempotency_key = 1;
  oneof audience {
    string community_id = 2;
    bool public = 3;
  }
  BeaconActivity activity = 4;
  string title = 5;
  string details = 6;
  string venue = 7;
  google.protobuf.Timestamp start_at = 8;
  int32 duration_minutes = 9;
  int32 open_spots = 10;
  BeaconCost cost = 11;
  ChatPreference chat_preference = 12;
}

message CreateBeaconResponse {
  BeaconView view = 1;
}

message UpdateBeaconRequest {
  string idempotency_key = 1;
  string beacon_id = 2;
  optional string title = 3;
  optional string details = 4;
  optional string venue = 5;
  // Never below accepted_count.
  optional int32 open_spots = 6;
  // Unset = unchanged. [now + 5 min, now + 30 d]; only before the beacon starts.
  google.protobuf.Timestamp start_at = 7;
  // Unset = unchanged. 15-240; only before the beacon starts.
  optional int32 duration_minutes = 8;
  // Unset = unchanged. != UNSPECIFIED; only before the beacon starts.
  optional BeaconCost cost = 9;
}

message UpdateBeaconResponse {
  BeaconView view = 1;
}

message CancelBeaconRequest {
  string idempotency_key = 1;
  string beacon_id = 2;
}

message CancelBeaconResponse {}

message GetBeaconRequest {
  string beacon_id = 1;
}

message GetBeaconResponse {
  BeaconView view = 1;
}

message ListBeaconsRequest {
  oneof audience {
    string community_id = 1;
    bool public = 2;
  }
  // Beacons whose start_at >= from (default now); OPEN and FULL only, hidden excluded, blocks applied.
  google.protobuf.Timestamp from = 3;
  // Clamped: 0 = 20, above 50 = 50.
  int32 limit = 4;
  string page_token = 5;
}

message ListBeaconsResponse {
  repeated BeaconView views = 1;
  string next_page_token = 2;
}

message ListMyBeaconsRequest {
  MyBeaconsRole role = 1;
  MyBeaconsWindow window = 2;
  // Clamped: 0 = 20, above 50 = 50.
  int32 limit = 3;
  string page_token = 4;
}

message ListMyBeaconsResponse {
  repeated BeaconView views = 1;
  string next_page_token = 2;
}

message RequestToJoinRequest {
  string idempotency_key = 1;
  string beacon_id = 2;
  // 0-140 code points.
  string note = 3;
}

message RequestToJoinResponse {
  ViewerState viewer = 1;
}

message WithdrawJoinRequestRequest {
  string idempotency_key = 1;
  string beacon_id = 2;
}

message WithdrawJoinRequestResponse {}

message RespondToJoinRequestRequest {
  string idempotency_key = 1;
  string beacon_id = 2;
  // The requester. [A-Za-z0-9-]{1,128}, else VALIDATION "user_id".
  string user_id = 3;
  JoinResponse response = 4;
}

message RespondToJoinRequestResponse {
  BeaconView view = 1;
}

message LeaveBeaconRequest {
  string idempotency_key = 1;
  string beacon_id = 2;
}

message LeaveBeaconResponse {}

message RemoveParticipantRequest {
  string idempotency_key = 1;
  string beacon_id = 2;
  // The ACCEPTED participant. [A-Za-z0-9-]{1,128}, else VALIDATION "user_id".
  string user_id = 3;
}

message RemoveParticipantResponse {
  BeaconView view = 1;
}

message ListParticipantsRequest {
  string beacon_id = 1;
  ParticipantFilter filter = 2;
  // Clamped: 0 = 20, above 50 = 50.
  int32 limit = 3;
  string page_token = 4;
}

message ListParticipantsResponse {
  repeated Participant participants = 1;
  string next_page_token = 2;
}
