syntax = "proto3";

// Identity: profiles, handles, account lifecycle. Owner module: backend/internal/identity.
// Collections owned: users/{uid}, handles/{handleLower}, exports/{exportId}, privacy/protectedAuthors (the set of
// protected uids; never exported).
// Auth: every RPC requires a Firebase ID token + App Check token. The caller's uid comes from the token, never the body.
// Only Google, Apple and verified-email password sign-ins are accepted (anonymous only against the Auth emulator).
// Any other caller, notably a password account whose email is unverified, gets FAILED_PRECONDITION
// + PROFILE_REQUIRED before any Firestore read on every RPC except CheckHandleAvailability and CreateProfile, which
// answer EMAIL_NOT_VERIFIED. A profile-less verified caller on any other RPC gets PROFILE_REQUIRED after a
// single lookup, and is never answered RATE_LIMITED because of its IP address.
package dzeroth.identity.v1;

import "dzeroth/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/dzeroth/dzeroth/backend/gen/dzeroth/identity/v1;identityv1";

service IdentityService {
  // Creates the caller's profile after Firebase sign-up. Idempotent by uid: a replay returns the existing profile.
  // Transaction: read users/{uid} + handles/{h}; create users, handles, graph.
  // Needs a verified identity (Google, Apple or a password account with a verified email),
  // else FAILED_PRECONDITION + EMAIL_NOT_VERIFIED.
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);

  // Handle availability check for the sign-up form. In-memory rate limited (20/min/uid); there is no daily cap, so
  // only the per-minute bucket can reject.
  // Needs a verified identity: a password account whose email is unverified, and any sign-in other than Google,
  // Apple or verified password, gets FAILED_PRECONDITION + EMAIL_NOT_VERIFIED before any lookup
  // (and before any rate limiter). The client shows the "verify your email" banner and refreshes the ID token.
  // "Taken" is reported even when the handle's owner blocked the caller (accepted residual).
  // Free handles are negatively cached 10 s per instance (a just-freed handle may read "taken" for <= 60 s).
  rpc CheckHandleAvailability(CheckHandleAvailabilityRequest) returns (CheckHandleAvailabilityResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The caller's own profile + account state. users/{uid} instance-cached 60 s (updated in place on own writes);
  // unread count = count() aggregation on notifications with createdAt > users.notificationsSeenAt (cached 30 s).
  // enabled_features comes from server env config, with no lookup.
  // pending_follow_request_count: for a protected caller only, a count() aggregation on followRequests
  // where followeeId == caller, cached 30 s; every other caller gets 0 without a lookup. A
  // failed count leaves it 0 and GetMe still answers.
  // unread_conversation_count: only when FEATURE_MESSAGING is on for the caller, a count() aggregation
  // on users/{uid}/dmInbox where unreadCount > 0, Limit 100, cached 30 s; no lookup otherwise.
  // home_tabs: from users/{uid}, already read, so no lookup.
  rpc GetMe(GetMeRequest) returns (GetMeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Public profile by id or handle. Returns NOT_FOUND if the target blocked the caller, byte-identical to the
  // error for a missing user (no existence leak). The check uses the caller's own graph (blockedBy).
  // A caller who blocks the target still gets the profile (so they can unblock).
  // A protected account's profile is returned to every caller with every field, is_private and the
  // counts included, except pinned_post_id, which is empty unless the caller is the account or follows it (0 extra
  // reads: the follow bit comes from the caller's cached graph).
  // Reads: handles (if by handle) + users + caller graph; all instance-cached 60 s; a handle that doesn't exist is
  // negatively cached 10 s.
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Partial update; only fields that are set are changed. Naturally idempotent (sets values).
  // A change to display_name or avatar enqueues the author-snapshot refresh job:
  // async <= 100 post writes.
  // Private accounts: is_private=true needs FEATURE_PRIVATE_ACCOUNTS (wire name
  // "private_accounts") on for the caller, else FAILED_PRECONDITION + FEATURE_DISABLED, metadata["feature"] =
  // "private_accounts", writing nothing, checked before any read; a request that sets it with other fields is refused whole
  // while the flag is off for the caller. is_private=false is accepted from any caller whatever the flag, globally off
  // included. A changed is_private runs one transaction that reads users and the protected-author set fresh
  // and writes isPrivate and the set (add or remove the uid); it does not touch quotas/{uid}.
  // A value equal to the stored one writes nothing. Protecting
  // while PROTECTED_AUTHORS_MAX (20,000) accounts are protected => FAILED_PRECONDITION + LIMIT_REACHED,
  // metadata["limit"] = "private_accounts", writing nothing. No post is rewritten (there is no visibility job): every
  // read path applies the new setting at once on the instance that committed it and within 60 s on the others.
  // Existing followers stay. After an unprotect commit the server publishes one privacy_public job (the jobs topic)
  // that accepts every pending follow request (in pages of 100),
  // so the request path does none of that work; a failed publish is logged at ERROR. A toggle enqueues no
  // author-snapshot job.
  // Profile extras: setting banner_media_id, location, website or pinned_post_id
  // (any non-empty value, whitespace-only included) needs FEATURE_PROFILE_EXTRAS (wire name "profile_extras") on for the
  // caller; otherwise FAILED_PRECONDITION + FEATURE_DISABLED, metadata["feature"] = "profile_extras", writing nothing, checked
  // before validation. A request from outside the cohort that mixes a clear with a set is refused whole. The exact
  // string "" is a clear (banner removed, location or website emptied, pin removed) and is accepted from any
  // authenticated caller whatever the flag, globally off included, and is handled like a bio edit. While the flag
  // is globally off the response omits website and pinned_post_id (Profile). DEGRADED_MODE=readonly still refuses the
  // write. The display_name, bio and avatar path is unchanged. A banner, location, website or pin change does not enqueue the author-snapshot job
  // (none of them is in AuthorSnapshot). Field rules are on the request fields.
  // A request that changes nothing writes nothing. Per-uid daily call cap
  // PROFILE_UPDATES_PER_DAY, 100 calls/uid/IST day per instance (300 with 3) => RATE_LIMITED,
  // metadata["limit"] = "profile_update_daily", retry_after = time to IST midnight, before any lookup.
  // Replaced and removed images: a commit that replaced or removed the avatar or the banner
  // hands the old image to a best-effort retire step after the commit (the old URLs come from the document the
  // transaction read, and at most 2 Pub/Sub publishes go out, one per image); a failed hand-over is logged at ERROR and the image stays until account deletion.
  // The async job (kind profile_media_retired on the jobs topic) runs once per
  // image, and deletes the old public objects 24-48 h later through a bucket lifecycle rule, only while
  // PROFILE_MEDIA_RETIRE allows it (off by default; banner, or all for avatars too). A retired image can never be set
  // again: it answers MEDIA_NOT_READY like any unusable id.
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);

  // Rename. Transaction: read users + handles/{new}; create handles/{new}, delete handles/{old}, update users.
  // Cooldown 7 days (config HANDLE_CHANGE_COOLDOWN). Enqueues the author-snapshot refresh job.
  rpc ChangeHandle(ChangeHandleRequest) returns (ChangeHandleResponse);

  // Irreversible account deletion of the caller's own account. The uid always comes from the ID token; the
  // request has no uid field and must never get one. Requires a recent sign-in: ID token auth_time older than
  // ACCOUNT_DELETE_REAUTH_MAX_AGE (5 min) or missing => FAILED_PRECONDITION + ERROR_REASON_REAUTH_REQUIRED, writing nothing.
  // ACTIVE and SUSPENDED callers may both delete: this is the only RPC the account-status interceptor
  // lets a SUSPENDED or DELETING caller through to.
  // Sync part: one transaction reads users/{uid} fresh and sets status = DELETING, updatedAt, deletionRequestedAt and
  // deletionJob{seq: 0} (no job doc); after the commit it publishes {kind: account_delete, uid, seq: 0} to the
  // `jobs` Pub/Sub topic. A failed publish still returns success: a replay or the daily backstop re-publishes.
  // Replay: a caller already DELETING (same or new idempotency_key) gets the stored deletion_requested_at and writes nothing,
  // and the current job seq is re-published (deduped by the job).
  // The job (`/internal/pubsub/jobs`, self-chaining, <= 20 s of work per delivery) disables the Firebase Auth user and
  // revokes refresh tokens on its first delivery, waits until 120 s after deletionRequestedAt, then
  // deletes posts, the social graph, later-slice data, exports, handle and the quotas doc in batches of <= 500, then the
  // Firebase Auth user, and users/{uid} last. Reference account (300 posts, 100 following, 100 followers) completes in
  // about 3-5 minutes. Existing ID tokens stay valid up to 1 h but are rejected by the interceptor.
  // Only the per-minute default bucket limits it (no daily cap). DEGRADED_MODE=readonly rejects it; a
  // started deletion still finishes.
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);

  // Starts a data export of the caller's own account. Doc id = hash(uid, idempotency_key), so a replay with the same key
  // returns the same export and status. One export runs at a time per user: while one is PENDING (and under 24 h old),
  // a request with a new key returns that export, so export_id may belong to an earlier request; that key starts its own
  // export if retried after that one finished. After the commit it publishes {kind: account_export, export_id} to the
  // `jobs` topic; one delivery writes a single JSON file (account, profile, graph, posts; never who blocked you) to the
  // private `<project>-exports` bucket and sets READY, usually within a minute.
  // Requires a recent sign-in, like DeleteAccount: ID token auth_time older than ACCOUNT_DELETE_REAUTH_MAX_AGE (5 min)
  // or missing => FAILED_PRECONDITION + ERROR_REASON_REAUTH_REQUIRED, writing nothing; also on a replay.
  // GetAccountExport is not gated, so polling and the download keep working after the window.
  // Only the per-minute default bucket limits it (no daily cap). The transaction reads and touches quotas/{uid}
  // without counting anything, so two racing requests conflict and the loser replays the winner's export.
  // DEGRADED_MODE=readonly rejects it.
  rpc RequestAccountExport(RequestAccountExportRequest) returns (RequestAccountExportResponse);

  // Export status; when READY returns a fresh 15-minute signed GET URL (signed per call, never stored or logged).
  // NOT_FOUND, byte-identical in every case, when the export doesn't exist, belongs to another user, or is past
  // expires_at (even if the TTL or bucket lifecycle has not deleted it yet).
  // Only the per-minute default bucket limits it (no daily cap).
  rpc GetAccountExport(GetAccountExportRequest) returns (GetAccountExportResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

enum AccountStatus {
  ACCOUNT_STATUS_UNSPECIFIED = 0;
  ACCOUNT_STATUS_ACTIVE = 1;
  ACCOUNT_STATUS_SUSPENDED = 2;
  ACCOUNT_STATUS_DELETING = 3;
}

message Profile {
  string user_id = 1;
  // Display form; uniqueness is on the lower-cased form. 3-15 chars, [A-Za-z0-9_].
  string handle = 2;
  // 1-50 chars after NFC normalization.
  string display_name = 3;
  // <= 160 chars.
  string bio = 4;
  // 400 px avatar; empty if none.
  string avatar_url = 5;
  // 96 px avatar for lists; empty if none.
  string avatar_thumb_url = 6;
  // True when the account is protected: its posts, its followers and following lists and its pinned post
  // are shown only to the account and its approved followers. The profile itself (this message, counts included)
  // stays public. Set with UpdateProfile.is_private.
  bool is_private = 7;
  bool verified = 8;
  int64 followers_count = 9;
  int64 following_count = 10;
  int64 posts_count = 11;
  // Clients render "Joined Month YYYY" from this (no extra field).
  google.protobuf.Timestamp created_at = 12;
  // Profile extras. Data set while FEATURE_PROFILE_EXTRAS was on keeps rendering after a ramp-down; only
  // pinned_post_id and website are withheld while the flag is globally off (D3, D9, Amendment 1 A1), in every Profile
  // including the owner's own. Nothing stored is erased, and the banner and location are not withheld.
  // 1500 x 500 banner (cover image, 3:1); empty if none. A new banner has a new URL (immutable object).
  string banner_url = 13;
  // 600 x 200 banner for small layouts; empty if none.
  string banner_thumb_url = 14;
  // Free-text location, <= 30 code points, single line; empty if none.
  string location = 15;
  // An absolute http(s) URL, <= 100 characters, as typed except the lower-cased scheme; empty if none.
  // Show the host only (punycode for a non-ASCII host) and open it outside the app. The server never fetches it.
  // Always empty while FEATURE_PROFILE_EXTRAS is globally off (Amendment 1 A1), the owner's view included, so an owner
  // cannot offer Remove for it then; the stored value returns when the flag is back on.
  string website = 16;
  // The owner's one pinned post; empty if none, and always empty while FEATURE_PROFILE_EXTRAS is
  // globally off. Render it with PostsService.GetPost; NOT_FOUND (deleted or taken down) => hide the pinned row.
  // Cleared by the server when the post is deleted; a takedown keeps it, so a restore brings the pin back.
  // Also empty for a caller who may not see a protected account's posts: neither the account nor a
  // follower of it.
  string pinned_post_id = 17;
  // Paid subscription verification entitlement. Set only by trusted subscription administration after confirming
  // an active paid subscription; unrelated to verified identity or email status.
  bool subscription_verified = 18;
  // Who can start a direct message with this account (F9). UNSPECIFIED means EVERYONE_REQUESTS (today's behaviour).
  // Always UNSPECIFIED while FEATURE_DM_POLICY is globally off, in every Profile including the owner's own; the stored
  // value returns when the flag is back on. Clients grey out a recipient whose policy is FOLLOWING_ONLY unless that
  // account follows the caller (the server decides: SendMessage answers CANNOT_MESSAGE).
  DmPolicy dm_policy = 19;
}

// Who may start a direct message with an account. Existing accepted conversations always keep working.
enum DmPolicy {
  // Same as EVERYONE_REQUESTS. Every account created before the setting existed has it.
  DM_POLICY_UNSPECIFIED = 0;
  // Anyone can message; a sender the account does not follow arrives as a message request (messaging.proto).
  DM_POLICY_EVERYONE_REQUESTS = 1;
  // Only accounts that this account follows can start a conversation or add to a pending request.
  DM_POLICY_FOLLOWING_ONLY = 2;
}

message CreateProfileRequest {
  string idempotency_key = 1;
  string handle = 2;
  string display_name = 3;
}

message CreateProfileResponse {
  Profile profile = 1;
}

message CheckHandleAvailabilityRequest {
  string handle = 1;
}

message CheckHandleAvailabilityResponse {
  bool available = 1;
  // Set when the handle is syntactically invalid or reserved; empty otherwise.
  string reason = 2;
}

message GetMeRequest {}

message GetMeResponse {
  Profile profile = 1;
  AccountStatus status = 2;
  // From the ID token claim (no Firestore read). Posting requires true or a Google/Apple provider.
  bool email_verified = 3;
  int64 unread_notification_count = 4;
  // Server feature flags enabled for this caller, lower snake case, e.g. "graph". A missing name means
  // off; clients ignore names they don't know. The server stays authoritative: a disabled feature's RPCs return
  // FAILED_PRECONDITION + ERROR_REASON_FEATURE_DISABLED.
  repeated string enabled_features = 5;
  // Pending incoming follow requests: set for a protected caller only, else 0. A count cached 30 s, so
  // it may lag a new request or a response by up to 30 s. Drives the Follow requests entry and its badge.
  int64 pending_follow_request_count = 6;
  // Inbox conversations with unread messages: set only when FEATURE_MESSAGING is on for the caller,
  // else 0. Capped at 100 (show "99+"); message requests do not count (ListConversations.request_count shows them). A
  // count cached 30 s, evicted on the serving instance by a send to or a mark-read by the caller, so it may lag by up
  // to 30 s. Drives the Messages badge.
  int64 unread_conversation_count = 7;
  // The caller's pinned Home tabs in order, after the fixed Following tab (founder decision F5): at most
  // HOME_TABS_MAX_PINNED (5). Read from users/{uid}.homeTabs, the document this RPC already reads.
  // Tabs of a kind whose flag is off for the caller (LIST: FEATURE_LISTS; COMMUNITY: FEATURE_COMMUNITIES)
  // are omitted here but kept in storage, so they come back with the flag. A tab may name a list that was deleted or
  // made private since, or a community that was suspended: the client learns it from GetListTimeline's or
  // GetCommunityTimeline's NOT_FOUND, shows the tab as unavailable and offers Unpin. Written by
  // TimelineService.SetHomeTabs; up to 60 s stale on another instance (the profile cache).
  repeated dzeroth.common.v1.HomeTab home_tabs = 8;
}

message GetProfileRequest {
  oneof target {
    string user_id = 1;
    // Case-insensitive.
    string handle = 2;
  }
}

message GetProfileResponse {
  Profile profile = 1;
}

message UpdateProfileRequest {
  string idempotency_key = 1;
  optional string display_name = 2;
  optional string bio = 3;
  // A READY media id with purpose AVATAR owned by the caller; "" removes the avatar. A replaced or removed avatar's
  // objects are deleted 24-48 h later when PROFILE_MEDIA_RETIRE=all, otherwise kept until
  // account deletion; a retired avatar answers MEDIA_NOT_READY if sent again.
  optional string avatar_media_id = 4;
  // true protects the account (needs FEATURE_PRIVATE_ACCOUNTS on for the caller); false unprotects it, from any
  // caller. Cap: see UpdateProfile.
  optional bool is_private = 5;
  // Profile extras: setting any of the four fields below needs FEATURE_PROFILE_EXTRAS on for the caller; the
  // exact value "" (a clear) never does (see UpdateProfile).
  // A READY or READY_UNSCREENED media id with purpose BANNER owned by the caller; "" removes the banner.
  // Anything else (unknown, PENDING, REJECTED, another purpose, another owner) => FAILED_PRECONDITION +
  // MEDIA_NOT_READY, one answer for every cause, a banner that was replaced or removed earlier (retired) included. A
  // replaced or removed banner's objects are deleted 24-48 h later when PROFILE_MEDIA_RETIRE covers banners,
  // otherwise kept until account deletion.
  optional string banner_media_id = 6;
  // <= 30 code points after NFC and trim, single line; no control or bidi formatting characters (the bio rules);
  // else INVALID_ARGUMENT + VALIDATION, metadata["field"] = "location". "" clears it.
  optional string location = 7;
  // <= 100 characters after trim; an absolute URL with scheme https or http, a non-empty host, no userinfo and no
  // control, whitespace or bidi characters; else INVALID_ARGUMENT + VALIDATION, metadata["field"] = "website".
  // Stored as typed with the scheme lower-cased. "" clears it.
  optional string website = 8;
  // The caller's own POST, QUOTE or REPLY that is visible (never a REPOST); "" unpins. Every other
  // case (missing, deleted, hidden, another user's post, a REPOST) is the same INVALID_ARGUMENT + VALIDATION,
  // metadata["field"] = "pinned_post_id", so the call is no existence oracle. One pin; a new value replaces it.
  optional string pinned_post_id = 9;
  // Who can message the caller (F9). FOLLOWING_ONLY needs FEATURE_DM_POLICY on for the caller (FAILED_PRECONDITION +
  // FEATURE_DISABLED, metadata["feature"] = "dm_policy", checked before any read); EVERYONE_REQUESTS is never gated (the
  // undo rule). UNSPECIFIED is rejected: INVALID_ARGUMENT + VALIDATION, metadata["field"] = "dm_policy". The change
  // reaches SendMessage on other instances within the profile cache TTL (60 s). Existing accepted conversations keep working.
  optional DmPolicy dm_policy = 10;
}

message UpdateProfileResponse {
  Profile profile = 1;
}

message ChangeHandleRequest {
  string idempotency_key = 1;
  string new_handle = 2;
}

message ChangeHandleResponse {
  Profile profile = 1;
}

message DeleteAccountRequest {
  string idempotency_key = 1;
}

message DeleteAccountResponse {
  google.protobuf.Timestamp deletion_requested_at = 1;
}

enum ExportStatus {
  EXPORT_STATUS_UNSPECIFIED = 0;
  EXPORT_STATUS_PENDING = 1;
  EXPORT_STATUS_READY = 2;
  EXPORT_STATUS_FAILED = 3;
}

message RequestAccountExportRequest {
  string idempotency_key = 1;
}

message RequestAccountExportResponse {
  string export_id = 1;
  ExportStatus status = 2;
}

message GetAccountExportRequest {
  string export_id = 1;
}

message GetAccountExportResponse {
  string export_id = 1;
  ExportStatus status = 2;
  // Only when READY. 15-minute signed GET URL for a private JSON object.
  string download_url = 3;
  google.protobuf.Timestamp download_url_expires_at = 4;
  // created_at + 7 days. The JSON object in the private `<project>-exports` bucket (age = 7 lifecycle) and the
  // exports doc (Firestore TTL) are deleted after it; both delete late, so the server returns NOT_FOUND from this
  // time on. Deleting the account deletes its exports at once.
  google.protobuf.Timestamp expires_at = 5;
}
