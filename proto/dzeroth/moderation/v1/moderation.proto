syntax = "proto3";

// Moderation: user reports (App Store 1.2 / Play UGC requirement). Owner module: backend/internal/moderation.
// Collections owned: reports/{reportId}. Moderator actions (list, resolve, takedown, suspend) are NOT RPCs at
// Stage 0: they are `opsctl` commands run by the founder (ADR-0016, no admin console), so this service has one RPC.
// Every ModerationService RPC is behind the FEATURE_REPORTS server flag (wire name `reports`): when it is off for the
// caller the RPC returns FAILED_PRECONDITION + ERROR_REASON_FEATURE_DISABLED with 0 reads.
// Privacy: the reporter's identity is never returned to, or derivable by, the reported user.
package dzeroth.moderation.v1;

option go_package = "github.com/dzeroth/dzeroth/backend/gen/dzeroth/moderation/v1;moderationv1";

service ModerationService {
  // Report a post or an account. Quota: 20 reports/day (quotas/{uid}, `reports` counter; 5/day for accounts younger
  // than 24 h).
  // target_type POST: target_id is a 19-digit post id; the post must be visible to the caller exactly as GetPost
  // defines (missing, deleted, taken-down, blocked-author or non-ACTIVE-author => NOT_FOUND, one message for every
  // cause). target_type ACCOUNT: target_id is a user id; visible exactly as GetProfile defines (missing, non-ACTIVE
  // or blocked-the-caller => NOT_FOUND).
  // Reporting your own post, account, message or list => INVALID_ARGUMENT + VALIDATION field "target_id".
  // note: optional, <= 500 code points after NFC and trim; control characters other than LF => VALIDATION "note".
  // The report doc copies the reported post's text, author handle and media ids ("evidence"), so a later author
  // delete does not destroy it. For target_type ACCOUNT the evidence is the profile as the reporter saw it: handle,
  // display name, bio, location, website, avatar URL and banner URL (ADR-0024 Amendment 1 A3), copied from the profile
  // the call already loads (0 extra reads), so a link or image cannot be swapped before triage. While
  // FEATURE_PROFILE_EXTRAS is globally off the reporter sees no website, so none is kept. Retention and access follow
  // the post evidence: resolved + 90 days, never returned to any client.
  // Idempotency: the report doc id is derived from (reporter, target_type, target_id), so the same reporter reporting
  // the same target again is a success with already_reported=true, 0 writes and no quota charge, regardless of
  // idempotency_key. idempotency_key (required, <= 64 chars) is still validated for contract uniformity.
  // Firestore: reads cold 6 (interceptor caller users 1, post 1 + author users 1 + caller graph 1 for POST or
  // target users 1 for ACCOUNT, report doc 1, quotas 1), warm 2 (report doc, quotas); planning 3. A LIST target (plan W5-44) reads the
  // list, caller graph, owner users and owner graph (4, all cache-first) instead: 7 cold, 2 warm. Writes 2 (report
  // create, quotas); replay 0. No async work. Nothing here loops over documents.
  rpc ReportContent(ReportContentRequest) returns (ReportContentResponse);
}

enum ReportTargetType {
  REPORT_TARGET_TYPE_UNSPECIFIED = 0;
  REPORT_TARGET_TYPE_POST = 1;
  REPORT_TARGET_TYPE_ACCOUNT = 2;
  // A direct message (ADR-0027 D12). target_id = "<convId>:<msgId>": the conversation id and the message id, 32
  // lower-case hex each, joined by ":". Only a participant may report, and only the peer's message (own => VALIDATION
  // "target_id"). The evidence is that one message's text, the sender's handle and its time; nothing else from the
  // conversation. Needs FEATURE_MESSAGING not globally off; the existing reports quota applies.
  REPORT_TARGET_TYPE_MESSAGE = 3;
  // A list (ADR-0030, plan W5-44). target_id = the list id (19 digits). Only a list the caller may see (ADR-0030 D3) can be
  // reported; a private, hidden, missing or blocking-owner list is the one NOT_FOUND "list not found", and the caller's own
  // list => VALIDATION "target_id". The evidence is the owner's handle, the list's name and description and its creation
  // time (no member id), kept in the report document with the post evidence's retention. Needs FEATURE_LISTS not globally
  // off; the existing reports quota applies. Firestore: reads cold 7 (interceptor 1, list 1, caller graph 1, owner users 1,
  // owner graph 1, report doc 1, quotas 1), warm 2; writes 2.
  REPORT_TARGET_TYPE_LIST = 4;
}

// Reasons shown in the client sheet. Values are never renumbered or reused (buf breaking).
enum ReportReason {
  REPORT_REASON_UNSPECIFIED = 0;
  REPORT_REASON_SPAM = 1;
  REPORT_REASON_HARASSMENT = 2;
  REPORT_REASON_HATE = 3;
  REPORT_REASON_VIOLENCE = 4;
  REPORT_REASON_SEXUAL = 5;
  REPORT_REASON_SELF_HARM = 6;
  REPORT_REASON_ILLEGAL = 7;
  REPORT_REASON_IMPERSONATION = 8;
  REPORT_REASON_OTHER = 9;
}

message ReportContentRequest {
  string idempotency_key = 1;
  ReportTargetType target_type = 2;
  string target_id = 3;
  ReportReason reason = 4;
  string note = 5;
}

message ReportContentResponse {
  string report_id = 1;
  // True when this reporter had already reported this target; nothing was written.
  bool already_reported = 2;
}
