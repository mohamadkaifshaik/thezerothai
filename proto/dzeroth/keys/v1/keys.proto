syntax = "proto3";

// Key directory for end-to-end encrypted direct messages: each encryption device publishes a public signature key and a
// pool of opaque MLS key packages, and a user who may message another user looks up that user's devices and claims one
// key package per device. The server stores and hands out opaque bytes; it never parses a key package and never sees
// message content. Clients MUST check that a claimed key package's credential and signature key match both
// ClaimedKeyPackage.signature_public_key and the device's directory entry (GetKeyDevices) before using it; on a mismatch
// the client skips that device (it does not fail the whole operation).
// Owner module: backend/internal/keys.
// Collections owned: users/{uid}/keyDevices/{deviceId} (signatureKey (bytes), createdAt, lastSeenAt, lastResort (bytes,
// absent = none), poolCount, removedAt (absent while live)) and its subcollection
// users/{uid}/keyDevices/{deviceId}/keyPackages/{id} (the one-time pool; data (bytes) and createdAt; id = the first 32
// hex characters of the SHA-256 of the bytes); and the removed marks users/{uid}/keyDeviceRemovals/{deviceId} (removedAt,
// expireAt = removedAt + 90 days, the Firestore TTL field; doc id = the device id), written by RemoveKeyDevice with
// reason REMOTE. A device document that carries removedAt (a REMOTE removal in progress) is not a registered device:
// every read and claim skips it, but it keeps its place under the cap of 5 until the removal (or its retry) deletes it,
// so a user never has more than 5 device documents. All three are erased with the account; the account
// export lists device metadata and counts and the removed marks (device id and times), never key bytes.
//
// Key material is raw bytes: this is the first proto in the repo with `bytes` fields. Device ids, user ids and
// idempotency keys are strings. Nothing the server stores or returns is a message body.
//
// Flag FEATURE_E2EE_DM (wire name "e2ee_dm", default off). RegisterKeyDevice, UploadKeyPackages and ClaimKeyPackages
// need it on for the caller. GetKeyDevices, ListMyKeyDevices and RemoveKeyDevice need it only not globally off, so a
// user dropped from an allowlist can still see and remove their devices and can still look up the devices of a peer
// they share an accepted encrypted conversation with. Else FAILED_PRECONDITION + FEATURE_DISABLED,
// metadata["feature"] = "e2ee_dm", before any lookup. A TARGET whose own flag is off is not an error: see GetKeyDevices.
//
// Interplay with FEATURE_MESSAGING (wire name "messaging"), for GetKeyDevices and ClaimKeyPackages: a caller with
// "messaging" off gets CANNOT_MESSAGE for every other user; a target with "messaging" off is CANNOT_MESSAGE; a target
// with "messaging" on and only "e2ee_dm" off is an empty success (no devices, no packages), except that GetKeyDevices
// still returns the devices of a target the caller shares an accepted encrypted conversation with (see
// GetKeyDevices).
// ClaimKeyPackages stays an empty success.
//
// Limits: device id [A-Za-z0-9_-]{16,64}; signature_public_key exactly 32 bytes (Ed25519); a key package 1-4096 bytes;
// at most 100 key packages per upload and at most 100 stored per device (the pool); at most 5 devices per user; a device
// not seen for 30 days is inactive (one last seen exactly 30 days ago is inactive); GetKeyDevices takes 1-10 user ids.
//
// Inactive devices are flagged at read time (KeyDevice.inactive) and never deleted by the server: an inactive device
// is left out of ClaimKeyPackages, is left out of GetKeyDevices unless the caller shares an accepted encrypted
// conversation with its owner (then it is returned with inactive set), still appears in ListMyKeyDevices, still counts
// toward the cap of 5 until its owner removes it, and becomes active again when it next registers or uploads (same id,
// same key). Only RegisterKeyDevice and UploadKeyPackages move last_seen_at (at most once per 24 h); lookups, claims,
// lists and removes never do. A device unseen for 30 days drops out of claims, and out of lookups unless the caller
// shares an accepted encrypted conversation with its owner, so clients MUST call RegisterKeyDevice periodically (for example
// on app open, at most once a day), not only on first install.
//
// User references: user_ids (GetKeyDevicesRequest), user_id (UserKeyDevices, ClaimKeyPackagesRequest) carry the
// user_ref option (TRANSLATE), so with FEATURE_PUBLIC_IDS on the edge swaps them for public ids in both directions,
// as for every other service. device_id and exclude_device_id are device ids, not user references.
//
// Idempotency: every mutating RPC takes idempotency_key in the repo format (16-64 of [A-Za-z0-9_-], else VALIDATION
// "idempotency_key"). RegisterKeyDevice, RemoveKeyDevice and UploadKeyPackages are naturally idempotent and the key is
// only format-checked. ClaimKeyPackages is NOT replayable: a retry consumes fresh packages, and a failed or timed-out
// call may already have consumed some (see its comment).
//
// Errors:
// - INVALID_ARGUMENT + VALIDATION, metadata["field"] in idempotency_key | device_id | signature_public_key | key_packages
//   | last_resort_key_package | user_ids | user_id | exclude_device_id | reason (a RemoveReason value this server does
//   not know), before any lookup unless stated. The value is never echoed.
// - FAILED_PRECONDITION + FEATURE_DISABLED, metadata["feature"] = "e2ee_dm" (see the flag classes above).
// - FAILED_PRECONDITION + LIMIT_REACHED, metadata["limit"] = "key_devices": a sixth device (never evicts).
// - FAILED_PRECONDITION + CANNOT_MESSAGE (GetKeyDevices, ClaimKeyPackages): the caller may not message a target. ONE
//   byte-identical error for an unknown user, a user who is not ACTIVE, a block in either direction and any other
//   refusal by the messaging send rules. Do not retry. A failure of the send-rules check that is not a refusal (a read
//   failed) is a generic INTERNAL, or UNAVAILABLE as below, never the messaging module's own error. The send-rules
//   check reads through caches of up to 60 s: a block, an unfollow or an account status change can take up to 60 s to
//   apply here, while SendMessage applies it immediately (and is what guards the message itself).
// - FAILED_PRECONDITION + DEVICE_REMOVED, no metadata (RegisterKeyDevice, UploadKeyPackages): the device id was removed
//   with reason REMOTE within the last 90 days (at least; the mark ends when Firestore's TTL deletes it). Decided
//   before LIMIT_REACHED and before NOT_FOUND. Do not retry with the same id: set the device up again under a new id.
// - FAILED_PRECONDITION + REAUTH_REQUIRED (RemoveKeyDevice with reason REMOTE of an id not yet marked): the ID token's
//   auth_time is older than ACCOUNT_DELETE_REAUTH_MAX_AGE (5 min) or missing; nothing was written. Sign in again, then
//   retry.
// - NOT_FOUND: UploadKeyPackages for a device the caller has not registered (RemoveKeyDevice of a missing device is
//   success, not NOT_FOUND).
// - UNAVAILABLE (retry after the hinted delay): possible on any RPC for a real storage failure (contention on a
//   transaction, a timeout). Contention between concurrent claimers is never surfaced as an error (see
//   ClaimKeyPackages).
// - RESOURCE_EXHAUSTED + RATE_LIMITED: RATE_LIMIT_KEYS_WRITE_PER_MIN (20: RegisterKeyDevice, RemoveKeyDevice,
//   UploadKeyPackages), RATE_LIMIT_KEYS_READ_PER_MIN (60: ListMyKeyDevices, GetKeyDevices), RATE_LIMIT_KEYS_CLAIM_PER_MIN
//   (20: ClaimKeyPackages), per uid per instance; the daily cap KEYS_CLAIMS_PER_DAY (300 per uid) on
//   ClaimKeyPackages, metadata["limit"] = "keys_claims_daily"; and the daily cap KEYS_CLAIMS_PER_TARGET_PER_DAY (20 per
//   caller and target user, the caller's own id included) on ClaimKeyPackages, metadata["limit"] =
//   "keys_claims_per_target_daily". The daily caps are per instance too and reset at midnight IST. The per-target cap
//   is counted for every well-formed request before the send-rules check, so its refusal is the same for a blocked,
//   unknown or real target.
package dzeroth.keys.v1;

import "dzeroth/common/v1/options.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/dzeroth/dzeroth/backend/gen/dzeroth/keys/v1;keysv1";

service KeyService {
  // Publish the caller's encryption device. Needs the flag on for the caller. Naturally idempotent by device_id:
  // same id and same key => refreshes last_seen_at (at most once per 24 h; call it periodically, see the header) and
  // returns the device; same id with a different key => INVALID_ARGUMENT + VALIDATION "signature_public_key" (the
  // stored key is kept); a sixth device => FAILED_PRECONDITION + LIMIT_REACHED "key_devices" (never evicts); an id
  // removed with reason REMOTE (marked) => FAILED_PRECONDITION + DEVICE_REMOVED, decided before the device count, so a
  // marked id never learns about the cap. Validation: device_id and signature_public_key as in the header,
  // idempotency_key format. One transaction: 1 device read; for a new id also 1 mark read + a query of at most 6 device
  // documents; at most 1 write.
  rpc RegisterKeyDevice(RegisterKeyDeviceRequest) returns (RegisterKeyDeviceResponse);
  // The caller's devices, at most 5, oldest first; inactive ones (not seen for 30 days) are included, flagged by
  // last_seen_at and KeyDevice.inactive. Needs the flag only not globally off. Query of at most 5 device documents
  // (Limit 5). No cursor: the device limit caps the list at 5.
  rpc ListMyKeyDevices(ListMyKeyDevicesRequest) returns (ListMyKeyDevicesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Remove one of the caller's devices together with its key package pool and its last-resort package. A missing
  // device is success (idempotent); pool documents left under a missing device are deleted too. Needs the flag only
  // not globally off. Validation: device_id format, idempotency_key format. Not one atomic write: the pool is deleted
  // first, in pages of at most 100 documents, then one transaction deletes the device document only when its pool is
  // empty. The pool never holds more than 100 (UploadKeyPackages enforces that), so one page normally suffices; if
  // uploads keep refilling the pool, the sweep repeats for at most 5 rounds and then answers UNAVAILABLE (retry). A
  // failed or timed-out call may already have deleted some pool documents; retrying finishes the removal.
  // reason (see RemoveReason): SIGN_OUT and UNSPECIFIED remove only, as above, and remember nothing. REMOTE first reads
  // the mark (1 read); when the id is not yet marked it needs a recent sign-in (REAUTH_REQUIRED, nothing written);
  // then one transaction reads the device document and the mark (2 reads) and writes the mark (create, when absent)
  // and the device's removedAt (when the document exists and lacks it), at most 2 writes, before the pool sweep and
  // the delete above. From that transaction on the device is skipped by every read and claim, and RegisterKeyDevice and
  // UploadKeyPackages refuse the id with DEVICE_REMOVED.
  rpc RemoveKeyDevice(RemoveKeyDeviceRequest) returns (RemoveKeyDeviceResponse);
  // Add key packages to a registered device's pool and optionally replace its last-resort package. Needs the flag on
  // for the caller. Naturally idempotent: a key package's document id is derived from its bytes, so a replay stores
  // nothing twice while the packages are still in the pool, and duplicates within one request are stored once. A
  // replay after a claim can re-add a package that was already handed out (the server does not remember consumed
  // packages), so clients must tolerate a Welcome built on a consumed package and should follow a retried upload with
  // fresh packages. The pool holds at most 100: packages beyond the free space are dropped: when the pool is full the
  // oldest stay and the new packages are not stored (the response carries the resulting count, which can be
  // momentarily higher than the pool if a claim runs concurrently). An empty
  // last_resort_key_package means none sent: the stored one is kept. A device id removed with reason REMOTE =>
  // FAILED_PRECONDITION + DEVICE_REMOVED; any other unknown device => NOT_FOUND (one more read, the mark, decides
  // between the two). Neither key packages nor a last-resort package => VALIDATION "key_packages". Marks the device
  // seen (at most once per 24 h). One transaction: 1 device read + at most 100 reads (1 mark read instead when the
  // device is missing), at most 101 writes.
  rpc UploadKeyPackages(UploadKeyPackagesRequest) returns (UploadKeyPackagesResponse);
  // Devices of up to 10 users. Needs the flag only not globally off. Validation (1-10 user_ids, each a well-formed
  // user id, no duplicates, the caller's own id twice included, else VALIDATION "user_ids") and the send-rules check
  // for every id come first: for each target other than the caller, the caller must be allowed to
  // message the target by the messaging send rules; an unknown or non-ACTIVE user, a block in either direction and any
  // other refusal answer ONE byte-identical FAILED_PRECONDITION + CANNOT_MESSAGE, and one refused target fails the
  // whole call with that single CANNOT_MESSAGE (no partial result). Then, per target other than the caller: devices
  // are returned when the caller and the target both have the flag on, or the two share an accepted encrypted
  // conversation (computed by the server from the two raw uids; the conversation read may be up to 60 s stale);
  // otherwise the answer is an empty success, also for a caller whose flag is off (never FEATURE_DISABLED unless the
  // flag is globally off). For a pair that shares an accepted encrypted conversation every registered device is
  // returned, each carrying its inactive flag; otherwise active devices only, oldest first. A conversation that is
  // still a message request (not accepted) does not count: both sides get the ordinary rule. The caller's own id returns the caller's
  // active devices only when the caller's flag is on, else none (use ListMyKeyDevices). For other users only device_id,
  // signature_public_key and inactive are returned: created_at and last_seen_at are absent, key_package_count is 0
  // and has_last_resort is false. The caller's own devices carry every field. Reads: for each target other than the
  // caller, the send-rules check reads at most 4 documents, all cache-first (the caller's graph, the target's profile
  // and, only when the target accepts messages from accounts they follow, one follow edge and the conversation), plus
  // the target's graph when the caller has been blocked by so many accounts that their own list is truncated (then
  // at most 5), plus one conversation read per other target (served from a copy at most 60 s old when the conversation
  // exists; a Firestore read whenever no conversation exists); then at most 10 queries of at most 5 devices (the
  // caller and each target whose devices are returned: nothing is read for a refused or empty-success target). A
  // failed read is an error, never an empty list. No writes.
  rpc GetKeyDevices(GetKeyDevicesRequest) returns (GetKeyDevicesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Claim one key package per active device of user_id, devices oldest first. Needs the flag on for the caller. Same
  // send-rules check and the same single CANNOT_MESSAGE refusal as GetKeyDevices; a target with the flag off is an
  // empty success, and a flag-off caller cannot claim (FEATURE_DISABLED), so a flag-off target or caller can neither
  // be claimed for nor claim; a malformed user_id is VALIDATION "user_id". The response carries conversation_id (see
  // ClaimKeyPackagesResponse). For each active device the server consumes one
  // one-time package (which one is unspecified), else returns the device's last-resort package (last_resort = true,
  // not consumed), else has_key_package = false. Under heavy contention on one device the last-resort package (or
  // has_key_package = false) may be returned although one-time packages remain; contention is never an error. A
  // returned last-resort package may be one the device replaced a moment earlier (a stale read in a millisecond
  // window); the receiving device may then be unable to use it, and the sender should claim again.
  // There is no transaction: per device, one atomic write deletes one one-time package and decrements the count. Not
  // atomic across devices. Reads without contention: at most 15 (1 query of at most 5 devices + 1 or 2 pool queries of
  // at most 1 document per device); with contention at most 110 (at most 10 picks per device, 2 pool queries each, plus
  // 1 device read); plus the send-rules check's at most 4 (5, see GetKeyDevices) for another user. At most 10
  // committed writes.
  // NOT replayable: a retry consumes fresh packages, and idempotency_key is format-checked only. A failed or timed-out
  // call is not proof that nothing was consumed: packages may already have been taken, including for earlier devices
  // of the same call when a later device fails. Claiming for the caller's own user id requires exclude_device_id to be
  // one of the caller's devices, an inactive one included (VALIDATION "exclude_device_id"); that device is left out.
  // For another user exclude_device_id must be empty or a well-formed device id (VALIDATION "exclude_device_id") and
  // is ignored. Limited by RATE_LIMIT_KEYS_CLAIM_PER_MIN and the daily caps KEYS_CLAIMS_PER_DAY and
  // KEYS_CLAIMS_PER_TARGET_PER_DAY (see Errors).
  rpc ClaimKeyPackages(ClaimKeyPackagesRequest) returns (ClaimKeyPackagesResponse);
}

message KeyDevice {
  // [A-Za-z0-9_-]{16,64}, chosen by the device.
  string device_id = 1;
  // 32 bytes (Ed25519).
  bytes signature_public_key = 2;
  // The caller's own devices only; absent for other users' devices (GetKeyDevices).
  google.protobuf.Timestamp created_at = 3;
  // Moved at most once per 24 h, by RegisterKeyDevice and UploadKeyPackages only. The caller's own devices only;
  // absent for other users' devices (GetKeyDevices).
  google.protobuf.Timestamp last_seen_at = 4;
  // One-time packages in the pool. The caller's own devices only; 0 for other users' devices.
  int32 key_package_count = 5;
  // The caller's own devices only; false for other users' devices.
  bool has_last_resort = 6;
  // True when the device has not been seen for 30 days at the time of this read (the header's "inactive"). Set by
  // ListMyKeyDevices and GetKeyDevices; computed on the server's clock, never stored. An inactive device cannot be
  // claimed for or addressed by a welcome; it is still a registered device and is NOT a removed one.
  bool inactive = 7;
}

message RegisterKeyDeviceRequest {
  string idempotency_key = 1;
  string device_id = 2;
  // Exactly 32 bytes.
  bytes signature_public_key = 3;
}

message RegisterKeyDeviceResponse {
  KeyDevice device = 1;
}

message ListMyKeyDevicesRequest {}

message ListMyKeyDevicesResponse {
  // At most 5, oldest first; inactive ones included, flagged by last_seen_at. No cursor: the device limit caps it.
  repeated KeyDevice devices = 1;
}

// Why a device is removed. Decides whether the server remembers the id.
enum RemoveReason {
  // Builds before this field. Treated as SIGN_OUT.
  REMOVE_REASON_UNSPECIFIED = 0;
  // The device removes itself as it signs out. No removed mark: the same id may register again (a failed sign-out
  // registers it again).
  REMOVE_REASON_SIGN_OUT = 1;
  // The user removes another device of theirs (lost, stolen, sold). The server keeps a removed mark for at least 90
  // days: RegisterKeyDevice and UploadKeyPackages refuse the id with FAILED_PRECONDITION + DEVICE_REMOVED. Needs a
  // recent sign-in (FAILED_PRECONDITION + REAUTH_REQUIRED when the ID token's auth_time is older than
  // ACCOUNT_DELETE_REAUTH_MAX_AGE, 5 min, or missing; nothing is written) unless the id is already marked: a retry
  // finishes the removal without one. An id that was never registered is marked too (the answer does not tell whether
  // the id existed).
  REMOVE_REASON_REMOTE = 2;
}

message RemoveKeyDeviceRequest {
  string idempotency_key = 1;
  string device_id = 2;
  // See RemoveReason. Clients MUST set it.
  RemoveReason reason = 3;
}

message RemoveKeyDeviceResponse {}

message UploadKeyPackagesRequest {
  string idempotency_key = 1;
  string device_id = 2;
  // 0-100, each 1-4096 bytes. Opaque to the server.
  repeated bytes key_packages = 3;
  // Optional, 1-4096 bytes; replaces the stored one when set. Empty means none sent: the stored one is kept.
  bytes last_resort_key_package = 4;
}

message UploadKeyPackagesResponse {
  // One-time packages in the pool after the upload.
  int32 key_package_count = 1;
  bool has_last_resort = 2;
}

message GetKeyDevicesRequest {
  // 1-10; the caller's own id is allowed. A user reference: translated to and from the public id like every other
  // user id on the wire (options.proto, user_ref).
  repeated string user_ids = 1 [(dzeroth.common.v1.user_ref) = USER_REF_KIND_TRANSLATE];
}

message UserKeyDevices {
  // A user reference, translated like the others (options.proto, user_ref).
  string user_id = 1 [(dzeroth.common.v1.user_ref) = USER_REF_KIND_TRANSLATE];
  // For another user: every registered device (each carrying its inactive flag) when the caller and the user share an
  // accepted encrypted conversation, else active devices only; device_id, signature_public_key and inactive only (no
  // timestamps, no counts). The caller's own id: the caller's active devices with every field, returned only when the
  // caller's flag is on, else none.
  repeated KeyDevice devices = 2;
}

message GetKeyDevicesResponse {
  // Same order as the request, one entry per requested id (with no devices when the user has none to return).
  repeated UserKeyDevices users = 1;
}

message ClaimKeyPackagesRequest {
  string idempotency_key = 1;
  // A user reference, translated like the others (options.proto, user_ref).
  string user_id = 2 [(dzeroth.common.v1.user_ref) = USER_REF_KIND_TRANSLATE];
  // Lets a device claim for its own user's other devices without consuming its own package. Required when user_id is
  // the caller, and then must be one of the caller's devices (an inactive one included). For another user it must be
  // empty or a well-formed device id (else VALIDATION "exclude_device_id") and is ignored.
  string exclude_device_id = 3;
}

message ClaimedKeyPackage {
  string device_id = 1;
  // The device's key as the directory held it just before the package was taken. It can be stale if the device id was
  // removed (with reason SIGN_OUT; a REMOTE removal keeps the id from registering again for at least 90 days) and
  // registered again in that instant, so the client checks the key package's credential and signature key
  // against it and against the directory entry, and skips the device on a mismatch (see the file header).
  bytes signature_public_key = 2;
  // Empty when has_key_package is false.
  bytes key_package = 3;
  bool has_key_package = 4;
  // True when key_package is the device's last-resort package (reusable, not consumed).
  bool last_resort = 5;
}

message ClaimKeyPackagesResponse {
  // One per active device of user_id, oldest first, except: a device removed during the claim is left out, and for
  // the caller's own id the excluded device is left out.
  repeated ClaimedKeyPackage key_packages = 1;
  // The id the 1:1 conversation of the caller and user_id has or will have (32 lower-case hex): set on every
  // success for another user, an empty one included; empty for the caller's own id; never sent with an error. Not a
  // user reference. A caller can thereby confirm a guessed internal id behind a public id: one claim per target
  // suffices and the guessing itself is offline; the claim caps bound only how many targets can be probed per day.
  string conversation_id = 2;
}
