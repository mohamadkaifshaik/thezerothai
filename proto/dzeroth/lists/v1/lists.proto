syntax = "proto3";

// Lists (W5 Part A): a named set of up to LIST_MAX_MEMBERS (150) accounts whose root posts, reposts and
// quotes are read as one chronological feed (TimelineService.GetListTimeline) and may be pinned as a Home tab
// (TimelineService.SetHomeTabs, IdentityService.GetMe home_tabs). Owner module: backend/internal/lists.
// Collection owned: lists/{listId} (ownerId, name, description, isPrivate, memberIds[], hidden, createdAt, updatedAt).
// Only lists.Service reads or writes it; firestore.rules stay deny-all to clients. Other modules read a list only
// through lists.Reader.
//
// Ids: list_id is a 64-bit Snowflake rendered as a 19-digit decimal string, like a post id (rule 1). It is
// time-ordered and therefore guessable, so authorization never relies on it. A list_id that is not 19 digits =>
// INVALID_ARGUMENT + VALIDATION, metadata["field"] = "list_id", before any lookup.
//
// Who sees a list (founder decision F3): a list is created PRIVATE unless the request says otherwise. A
// private list, a list hidden by the platform (opsctl), a list whose owner blocks the caller, a list whose owner
// is not ACTIVE, and a list whose owner's blockedBy overflowed (fail closed) all answer ONE NOT_FOUND to
// everyone but the owner, byte-identical to the NOT_FOUND for a list id that never existed. The owner always sees
// their own lists. Members are never told they were added (F4: no notification).
//
// Member rules: the owner cannot add an account that blocks the owner or that the owner blocks
// (NOT_FOUND, byte-identical to a missing user, so the call is no block oracle), nor a protected account the owner
// does not follow (FAILED_PRECONDITION + PROTECTED_ACCOUNT; is_private is already
// public on GetProfile, so this reveals nothing new). At read time, for every viewer, members who block the OWNER are
// dropped; for each viewer, members the viewer blocks or mutes and members who block the viewer are dropped; a
// protected member's posts are shown only to viewers that member has approved (posts.Audience). A
// dropped member stays in storage; the owner's next write to the list removes members who block the owner.
//
// Flag FEATURE_LISTS (wire name "lists", default off): every RPC here needs it on for the caller, else
// FAILED_PRECONDITION + FEATURE_DISABLED, metadata["feature"] = "lists", before any lookup. Clients learn it from
// IdentityService.GetMe enabled_features.
//
// Following (FEATURE_LIST_FOLLOWS, wire name "list_follows", default off): a viewer can follow a PUBLIC list
// (FollowList, UnfollowList). Only a public, not hidden list whose owner is ACTIVE and does not block the caller
// (either way) can be followed; any other case is the same NOT_FOUND as a missing list. Unfollow works on any list,
// including a private or deleted one (the viewer's own marker is removed). A follower who loses access (the list turns
// private, is hidden, is deleted, or a block starts) stops seeing it at once on every read (ListFollowedLists, DiscoverLists,
// GetList): access is decided at read time. follower_count is the number of followers, kept by the same transaction
// that writes or removes a follow marker; it is visible on every list the caller may see. A list is never followed by
// its own owner, and following a list the caller owns is a success with no effect.
// Discovery (DiscoverLists, same flag): public, not hidden lists of ACTIVE owners not blocked either way, most
// followed first. Suggestions (ListSuggestedMembers, FEATURE_LIST_SUGGESTIONS, wire name "list_suggestions"): owner only,
// people the caller follows who could be added now (the AddListMember rules), most recently followed first.
// Flag errors for these: FAILED_PRECONDITION + FEATURE_DISABLED, metadata["feature"] = "list_follows" or "list_suggestions".
//
// Idempotency (rule 4): every mutation takes idempotency_key (16-64 characters of [A-Za-z0-9_-], else
// VALIDATION "idempotency_key", before any lookup) and stores the standard TTL'd idempotency/{sha256(uid|rpc|key)} document
// (24 h) in the same transaction as its effect. A retry with the same key returns the stored outcome and writes nothing,
// whatever happened since; the same key with a different request body => INVALID_ARGUMENT +
// IDEMPOTENCY_KEY_REUSED. A mutation that changes nothing (adding a member already there, removing one who is not)
// still stores the idempotency document, so a late retry can never undo a newer change.
//
// Errors (clients branch on ErrorDetail.reason):
// - INVALID_ARGUMENT + VALIDATION, metadata["field"] in list_id | user_id | owner_id | contains_user_id | name |
//   description | page_token | idempotency_key; before any lookup.
// - FAILED_PRECONDITION + FEATURE_DISABLED, metadata["feature"] = "lists".
// - NOT_FOUND: one message for every cause above.
// - FAILED_PRECONDITION + LIMIT_REACHED, metadata["limit"] = "lists" (LISTS_MAX_PER_USER, 20 lists per owner) or
//   "list_members" (LIST_MAX_MEMBERS, 150 members per list); nothing is written.
// - FAILED_PRECONDITION + PROTECTED_ACCOUNT (AddListMember only, above).
// - RESOURCE_EXHAUSTED + RATE_LIMITED: the per-minute buckets RATE_LIMIT_LISTS_WRITE_PER_MIN (30) and
//   RATE_LIMIT_LISTS_READ_PER_MIN (30) per uid per instance (x 3 instances); honour retry_after. There is no daily
//   cap and no persisted daily quota on lists: the 20-list and 150-member caps bound them.
// - DEGRADED_MODE=readonly refuses every mutation through the existing interceptor; the reads still answer.
package dzeroth.lists.v1;

import "dzeroth/common/v1/common.proto";
import "dzeroth/graph/v1/graph.proto";

option go_package = "github.com/dzeroth/dzeroth/backend/gen/dzeroth/lists/v1;listsv1";

service ListService {
  // Create a list owned by the caller. The new list is private unless is_private is sent as false (F3).
  // name: 1-25 code points after NFC and trim; description: 0-100 code points; both single line, no control or bidi
  // formatting characters (the bio rules); else VALIDATION "name" / "description", before any lookup.
  // One transaction: idempotency doc, quotas/{uid} (read and rewritten unchanged, counting nothing, so two racing
  // creates conflict and the cap stays exact), a count() of the caller's lists (ownerId == caller), then Create
  // lists/{id} with a fresh Snowflake id.
  // At LISTS_MAX_PER_USER (20) => LIMIT_REACHED "lists".
  // A replay writes nothing, and neither does a refusal at the cap.
  rpc CreateList(CreateListRequest) returns (CreateListResponse);

  // Change a list's name, description or visibility. Owner only: any other caller, a missing list or a deleted one
  // => NOT_FOUND. Only the fields that are set change; the field rules are CreateList's. Making a list private stops
  // it serving non-owners at once on this instance and within 60 s on the others (the list instance cache).
  // One transaction: idempotency doc, the list (fresh). A request that changes nothing writes only the idempotency doc.
  // A rename of a list the caller has pinned also refreshes that tab's title (users/{uid}.homeTabs, through identity).
  // A request that changes nothing writes only the idempotency doc; a replay writes nothing.
  rpc UpdateList(UpdateListRequest) returns (UpdateListResponse);

  // Delete one of the caller's lists. Owner only; any other caller or a missing list => success with no effect
  // (NOT_FOUND is not returned, so a retry after a lost response succeeds). Other users who pinned the list keep a
  // dangling Home tab: GetListTimeline answers NOT_FOUND and the client offers Unpin. The caller's own pin of the list
  // is removed in the same call (a field-level update of users/{uid}.homeTabs through identity, only when pinned).
  // A replay writes nothing.
  rpc DeleteList(DeleteListRequest) returns (DeleteListResponse);

  // One list's header. NOT_FOUND for every cause in the header comment. pinned_by_viewer comes from the caller's own
  // users/{uid}.homeTabs, already read by the account-status interceptor.
  // Cached: the list doc 60 s per instance (CACHE_LISTS_ENTRIES), the owner's profile through identity.Directory, the
  // owner's graph snapshot 60 s (read for a non-owner caller only: blockedBy overflow, F4).
  rpc GetList(GetListRequest) returns (GetListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // An owner's lists, in creation order (oldest first). owner_id "" means the caller.
  // The caller's own lists: all of them, private ones included. Another owner's: public, not hidden lists only; an
  // owner who is missing, not ACTIVE or blocks the caller => NOT_FOUND (byte-identical to GetProfile's missing-user
  // error), and an owner whose blockedBy overflowed returns no lists.
  // contains_user_id (the "Add to Lists" sheet) is accepted only with the caller's own lists (owner_id "" or the
  // caller), else VALIDATION "contains_user_id", before any lookup: on another owner's lists it would be
  // a membership oracle. containing_list_ids lists the returned lists whose members include that user (the
  // member ids are in the list docs already read).
  // Paging: the caller's own lists page by page_size (0 => 20, max 50, clamped) with an opaque sealed next_page_token.
  // Another owner's lists are never paged: every public list comes back in one response and next_page_token is "",
  // whatever page_size is (a token or a short page would reveal the owner's private lists). The owner has at
  // most LISTS_MAX_PER_USER (20) lists.
  // Query: lists where ownerId == owner, Limit(page_size + 1) for the caller, Limit(LISTS_MAX_PER_USER) for another owner,
  // the automatic single-field index (no composite index).
  // Cached: the owner's list set 60 s per instance; a write by the owner updates this instance's copy.
  rpc ListUserLists(ListUserListsRequest) returns (ListUserListsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Add an account to one of the caller's lists. Owner only, else NOT_FOUND. user_id: [A-Za-z0-9-]{1,128}; self is
  // allowed (your own posts in your own list). The target must be ACTIVE (identity.Directory, cached) and pass the
  // member rules in the header comment (block either way => NOT_FOUND; a protected target the caller does not follow
  // => PROTECTED_ACCOUNT); the caller's blockedBy overflow adds one read of the target's graph (fail closed).
  // One transaction: idempotency doc, the list (fresh), then ArrayUnion into memberIds and
  // updatedAt. The same write removes members who block the caller (F4 lazy drop, from the caller's graph snapshot).
  // At LIST_MAX_MEMBERS (150) => LIMIT_REACHED "list_members".
  // Already a member => success, the idempotency doc only.
  // A replay and a refusal write nothing.
  rpc AddListMember(AddListMemberRequest) returns (AddListMemberResponse);

  // Remove an account from one of the caller's lists. Owner only, else NOT_FOUND. Not a member => success, the
  // idempotency doc only. The same write removes members who block the caller (F4).
  // A replay writes nothing.
  rpc RemoveListMember(RemoveListMemberRequest) returns (RemoveListMemberResponse);

  // A list's members, most recently added first, as user rows with the caller's relationship to each
  // (from the caller's graph). NOT_FOUND for every cause in the header comment. Members who are not ACTIVE and the
  // member drops in the header comment are left out, so a page may be short while next_page_token is set: keep
  // following it. UserListItem.since is unset (memberIds carries no timestamps); user.is_private is set (live row).
  // Paging: page_size 0 => 20, max 50 (clamped); page_token is sealed, bound to the caller and the list, and expires
  // after 24 h (expired, foreign or tampered => VALIDATION "page_token", before any lookup).
  rpc ListListMembers(ListListMembersRequest) returns (ListListMembersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Follow a public list (FEATURE_LIST_FOLLOWS). NOT_FOUND for every case the header comment lists (a private or hidden
  // list, an owner who is not ACTIVE or blocks either way, a missing or deleted list). Following a list the caller owns
  // is success with no effect. Following again is success with no effect.
  // Cap: LIST_FOLLOWS_MAX_PER_USER (100) follows per account => FAILED_PRECONDITION + LIMIT_REACHED, metadata["limit"] =
  // "list_follows"; nothing is written.
  // One transaction: idempotency doc, the list (fresh: visibility is checked again inside it), the follow marker
  // (create), and follower_count + 1 on the list. Rate limit: the lists write bucket.
  rpc FollowList(FollowListRequest) returns (FollowListResponse);

  // Unfollow a list (FEATURE_LIST_FOLLOWS). Works on any list, including one that is now private, hidden or deleted; a
  // list the caller never followed is success with no effect. When the list still exists, follower_count - 1 in the same
  // transaction; when it is gone, only the marker is removed.
  // A replay writes nothing.
  rpc UnfollowList(UnfollowListRequest) returns (UnfollowListResponse);

  // The lists the caller follows, newest follow first, with the caller's current view of each list. A list the
  // caller can no longer see (private, hidden, deleted, owner not ACTIVE, a block either way) is left out, so a page may
  // be short while next_page_token is set: keep following it. Paging: page_size 0 => 20, max 50 (clamped);
  // page_token is sealed, bound to the caller, expires after 24 h (else VALIDATION "page_token").
  // FEATURE_LIST_FOLLOWS only.
  rpc ListFollowedLists(ListFollowedListsRequest) returns (ListFollowedListsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Popular public lists, most followed first (follower_count descending, then list id). Only public, not hidden lists
  // whose owner is ACTIVE and does not block the caller (either way) are returned; a page may be short while
  // next_page_token is set. Lists created before follower_count existed appear here only after their first follow or
  // a recount. Paging: page_size 0 => 20, max 50 (clamped); page_token is sealed, bound to the caller, expires after 24 h.
  // FEATURE_LIST_FOLLOWS only.
  rpc DiscoverLists(DiscoverListsRequest) returns (DiscoverListsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Suggested members for one of the caller's lists (FEATURE_LIST_SUGGESTIONS). Owner only, else NOT_FOUND. Candidates are
  // the accounts the caller most recently followed (at most the 30 newest), minus current members and the caller; each must
  // pass the AddListMember rules (ACTIVE, no block either way, a protected account the caller follows). Most recently
  // followed first. max_results: 0 => 5, max 10 (clamped). There is no cursor: the list is always short (the
  // ListSuggestedUsers precedent). A list that is full at LIST_MAX_MEMBERS returns no suggestions.
  rpc ListSuggestedMembers(ListSuggestedMembersRequest) returns (ListSuggestedMembersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// One list as the caller may see it.
message ListInfo {
  // 19-digit Snowflake.
  string list_id = 1;
  // Live row from identity.Directory (up to 60 s stale). is_private is set as on other live rows.
  dzeroth.common.v1.AuthorSnapshot owner = 2;
  string name = 3;
  string description = 4;
  // True for a private list (the default at creation, F3). Only the owner ever receives a private list.
  bool is_private = 5;
  // The stored member count (memberIds length), including members a given viewer does not see.
  int32 member_count = 6;
  // True when the caller has this list pinned as a Home tab (IdentityService.GetMe home_tabs).
  bool pinned_by_viewer = 7;
  // Followers of the list. Set only when FEATURE_LIST_FOLLOWS is on for the caller; 0 otherwise.
  int32 follower_count = 8;
  // True when the caller follows this list. Set only when FEATURE_LIST_FOLLOWS is on for the caller; false otherwise.
  bool followed_by_viewer = 9;
}

message CreateListRequest {
  string idempotency_key = 1;
  // 1-25 code points after NFC and trim.
  string name = 2;
  // 0-100 code points after NFC and trim.
  string description = 3;
  // Absent => true: the list is private (F3). Send false to create a public list.
  optional bool is_private = 4;
}

message CreateListResponse {
  ListInfo list = 1;
}

message UpdateListRequest {
  string idempotency_key = 1;
  string list_id = 2;
  // Only the fields that are set change. name cannot be cleared ("" => VALIDATION "name").
  optional string name = 3;
  // "" clears the description.
  optional string description = 4;
  optional bool is_private = 5;
}

message UpdateListResponse {
  ListInfo list = 1;
}

message DeleteListRequest {
  string idempotency_key = 1;
  string list_id = 2;
}

message DeleteListResponse {}

message GetListRequest {
  string list_id = 1;
}

message GetListResponse {
  ListInfo list = 1;
}

message ListUserListsRequest {
  // "" => the caller.
  string owner_id = 1;
  // Optional; only with the caller's own lists (see ListUserLists).
  string contains_user_id = 2;
  // 0 => 20; max 50 (clamped).
  int32 page_size = 3;
  string page_token = 4;
}

message ListUserListsResponse {
  repeated ListInfo lists = 1;
  // Ids of the returned lists whose members include contains_user_id. Empty when contains_user_id is "".
  repeated string containing_list_ids = 2;
  // "" => no more (always "" while LISTS_MAX_PER_USER <= 20).
  string next_page_token = 3;
}

message AddListMemberRequest {
  string idempotency_key = 1;
  string list_id = 2;
  string user_id = 3;
}

message AddListMemberResponse {
  ListInfo list = 1;
}

message RemoveListMemberRequest {
  string idempotency_key = 1;
  string list_id = 2;
  string user_id = 3;
}

message RemoveListMemberResponse {
  ListInfo list = 1;
}

message ListListMembersRequest {
  string list_id = 1;
  // 0 => 20; max 50 (clamped).
  int32 page_size = 2;
  string page_token = 3;
}

message ListListMembersResponse {
  repeated dzeroth.graph.v1.UserListItem users = 1;
  // "" => no more.
  string next_page_token = 2;
}

message FollowListRequest {
  string idempotency_key = 1;
  string list_id = 2;
}

message FollowListResponse {
  ListInfo list = 1;
}

message UnfollowListRequest {
  string idempotency_key = 1;
  string list_id = 2;
}

message UnfollowListResponse {}

message ListFollowedListsRequest {
  // 0 => 20; max 50 (clamped).
  int32 page_size = 1;
  string page_token = 2;
}

message ListFollowedListsResponse {
  repeated ListInfo lists = 1;
  // "" => no more.
  string next_page_token = 2;
}

message DiscoverListsRequest {
  // 0 => 20; max 50 (clamped).
  int32 page_size = 1;
  string page_token = 2;
}

message DiscoverListsResponse {
  repeated ListInfo lists = 1;
  // "" => no more.
  string next_page_token = 2;
}

message ListSuggestedMembersRequest {
  string list_id = 1;
  // 0 => 5; max 10 (clamped).
  int32 max_results = 2;
}

message ListSuggestedMembersResponse {
  repeated dzeroth.graph.v1.UserListItem users = 1;
}
