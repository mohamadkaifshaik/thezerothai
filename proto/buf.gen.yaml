# Code generation (ADR-0002). Run from proto/: `buf generate` (wrapped by `make proto`).
# Output paths are relative to proto/. Generated code is never edited by hand (.claude/hooks/guard.sh).
#
# Go:   backend/gen/dzeroth/<pkg>/v1/*.pb.go               import path github.com/dzeroth/dzeroth/backend/gen/dzeroth/<pkg>/v1
#       backend/gen/dzeroth/<pkg>/v1/<pkg>v1connect/*.go   Connect handlers + clients
# Dart: app/lib/gen/dzeroth/<pkg>/v1/*.pb.dart, *.connect.client.dart (+ google/protobuf WKTs)
#
# Remote plugins run on the BSR (no local protoc plugins needed). Pin versions (`remote: ...:vX.Y.Z`) once the
# first generate succeeds in CI so generated code is reproducible.
version: v2
clean: false
plugins:
  - remote: buf.build/protocolbuffers/go
    out: ../backend/gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.19.1
    out: ../backend/gen
    opt: paths=source_relative
  - remote: buf.build/protocolbuffers/dart
    out: ../app/lib/gen
    include_imports: true
    include_wkt: true
  - remote: buf.build/connectrpc/dart
    out: ../app/lib/gen
