name: Deploy dev

# On every push to main: build the api image with ko, push to dev's
# Artifact Registry, deploy it to Cloud Run dev at 100% traffic, then deploy
# Firestore rules/indexes and the web app to Firebase Hosting (dev site).
# See release-rollout skill. This never touches prod.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for WIF; nothing else needs elevated perms

concurrency:
  group: deploy-dev
  cancel-in-progress: false # never cancel a deploy mid-flight

env:
  # Not KO_GO_PATH: ko reads that variable as the path to the `go` binary.
  API_MAIN_PKG: ./cmd/api

jobs:
  deploy:
    name: Build + deploy dev
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Auth to GCP (WIF)
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.DEV_DEPLOY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEV_CI_DEPLOY_SA_EMAIL }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Skip if backend not buildable yet
        id: gate
        run: |
          if [ ! -f backend/go.mod ]; then
            echo "::warning::backend/go.mod not present yet — nothing to build. Skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: steps.gate.outputs.skip == 'false'
        with:
          # Latest 1.26 patch (stdlib security fixes); go.mod only states the minimum language version.
          go-version: "1.26.x"
          check-latest: true

      - uses: ko-build/setup-ko@d006021bd0c28d1ce33a07e7943d48b079944c8d # v0.9
        if: steps.gate.outputs.skip == 'false'

      - name: Build + push image with ko
        if: steps.gate.outputs.skip == 'false'
        id: build
        working-directory: backend
        env:
          KO_DOCKER_REPO: ${{ vars.DEV_ARTIFACT_REGISTRY_URL }}/api # Artifact Registry needs <repo>/<image>
          IMAGE_TAG: ${{ github.sha }}
        run: |
          digest=$(ko build "${API_MAIN_PKG}" --bare -t "${IMAGE_TAG}")
          echo "image=${digest}" >> "$GITHUB_OUTPUT"

      - name: Deploy Firestore rules + indexes
        if: steps.gate.outputs.skip == 'false' && hashFiles('firebase.json') != ''
        run: |
          npm install -g firebase-tools@15
          firebase deploy --only firestore:rules,firestore:indexes \
            --project "${{ vars.DEV_PROJECT_ID }}" --non-interactive

      - name: Deploy Cloud Run revision (100% traffic — dev only)
        if: steps.gate.outputs.skip == 'false'
        run: |
          gcloud run deploy "${{ vars.DEV_SERVICE_NAME }}" \
            --project="${{ vars.DEV_PROJECT_ID }}" \
            --region="${{ vars.DEV_REGION }}" \
            --image="${{ steps.build.outputs.image }}" \
            --quiet

      - name: Smoke test dev (/health)
        if: steps.gate.outputs.skip == 'false'
        env:
          SERVICE: ${{ vars.DEV_SERVICE_NAME }}
          PROJECT: ${{ vars.DEV_PROJECT_ID }}
          REGION: ${{ vars.DEV_REGION }}
        run: |
          url=$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format='value(status.url)')
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$url/health"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: steps.gate.outputs.skip == 'false' && hashFiles('app/pubspec.yaml') != '' && hashFiles('firebase.json') != ''
        with:
          flutter-version: "3.47.5"
          channel: stable

      - name: Build + deploy web (Firebase Hosting, dev)
        if: steps.gate.outputs.skip == 'false' && hashFiles('app/pubspec.yaml') != '' && hashFiles('firebase.json') != ''
        working-directory: app
        env:
          # Web calls the API via the Firebase Hosting `/api/**` rewrite, not
          # the raw Cloud Run URL — same-origin, no CORS needed.
          API_BASE_URL: /api
          RECAPTCHA_SITE_KEY: ${{ vars.DEV_RECAPTCHA_SITE_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.DEV_GOOGLE_WEB_CLIENT_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.DEV_PROJECT_ID }}
        run: |
          flutter build web --release \
            --dart-define=USE_EMULATORS=false \
            --dart-define=FIREBASE_ENV=dev \
            --dart-define=API_BASE_URL="${API_BASE_URL}" \
            --dart-define=RECAPTCHA_SITE_KEY="${RECAPTCHA_SITE_KEY}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${GOOGLE_WEB_CLIENT_ID}"
          npm install -g firebase-tools@15
          # Deploy from the repo root: app/firebase.json (flutterfire metadata only) would otherwise shadow the
          # root firebase.json that defines hosting (public: app/build/web) and the /api/** rewrite.
          cd "$GITHUB_WORKSPACE"
          firebase deploy --only hosting --project "${FIREBASE_PROJECT_ID}" --non-interactive
