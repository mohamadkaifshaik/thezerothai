name: Release prod

# Tag v* (push, or workflow_dispatch run against that tag ref) -> build &
# push image -> deploy to prod Cloud Run with --no-traffic --tag candidate -> smoke
# test the rc URL -> build mobile release artifacts.
#
# This workflow NEVER shifts prod traffic and NEVER deploys Firebase Hosting.
# Promotion (10% -> 100%, plus the prod web deploy) is a separate, manual
# workflow: `promote-prod.yml`. On GitHub Free (private repo) there is no
# environment required-reviewers and no tag ruleset, so the founder clicking
# "Run workflow" on promote-prod.yml for a given stage IS the human approval
# — see docs/runbooks/cloud-bootstrap.md §6/6a and the release-rollout skill.
# CLAUDE.md rule still holds: "Never shift prod traffic without a passing
# production-reviewer verdict" — promote-prod.yml enforces that by requiring
# docs/reviews/release-<tag>-readiness.md to contain `VERDICT: GO`.
#
# Security note (M5/N7): there is deliberately no free-text `tag` input on
# workflow_dispatch — that let any collaborator with write access type an
# arbitrary string. Instead the workflow reads `github.ref_name` /
# `github.ref_type` directly: for `push` it's always the pushed tag; for
# `workflow_dispatch` the operator must pick a tag ref from GitHub's own
# ref selector (a branch selection is rejected in the first step). The
# resolved tag is validated against ^v[0-9]+\.[0-9]+\.[0-9]+$ in the very
# first step, and every subsequent use of it is via `env:` indirection
# (shell variable expansion), never spliced directly into a `run:` script
# via `${{ }}` — so it can't perform script injection against the
# prod-WIF-authenticated steps that follow.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  # Not KO_GO_PATH: ko reads that variable as the path to the `go` binary.
  API_MAIN_PKG: ./cmd/api

jobs:
  build-and-stage:
    name: Build image, deploy --no-traffic --tag candidate, smoke test
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      rc_url: ${{ steps.rc_url.outputs.url }}
      tag: ${{ steps.tagname.outputs.tag }}
    steps:
      - name: Resolve + validate release tag
        id: tagname
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # N7: no manual tag input — a workflow_dispatch run must itself be
          # targeted at a tag ref (pick it in GitHub's "Use workflow from"
          # ref selector). Reject anything dispatched against a branch.
          if [ "${REF_TYPE}" != "tag" ]; then
            echo "::error::This workflow must run from a tag ref (got ref_type='${REF_TYPE}', ref_name='${REF_NAME}'). For workflow_dispatch, select a tag under 'Use workflow from', not a branch."
            exit 1
          fi
          tag="${REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${tag}' does not match ^v[0-9]+.[0-9]+.[0-9]+\$ — refusing to release."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tagname.outputs.tag }}

      - name: Auth to GCP (WIF)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.PROD_DEPLOY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PROD_CI_DEPLOY_SA_EMAIL }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Latest 1.26 patch (stdlib security fixes); go.mod only states the minimum language version.
          go-version: "1.26.x"
          check-latest: true

      - uses: ko-build/setup-ko@d006021bd0c28d1ce33a07e7943d48b079944c8d # v0.9

      - name: Build + push image with ko
        id: build
        working-directory: backend
        env:
          KO_DOCKER_REPO: ${{ vars.PROD_ARTIFACT_REGISTRY_URL }}/api # Artifact Registry needs <repo>/<image>
          RELEASE_TAG: ${{ steps.tagname.outputs.tag }}
        run: |
          digest=$(ko build "${API_MAIN_PKG}" --bare -t "${RELEASE_TAG}")
          echo "image=${digest}" >> "$GITHUB_OUTPUT"

      # Deliberately no `working-directory:` here — firebase-tools reads
      # firebase.json from the step's cwd with no upward directory search, so
      # this must run from $GITHUB_WORKSPACE (repo root), which is where the
      # real firebase.json (firestore/storage/hosting config) lives.
      # app/firebase.json is a separate, flutterfire-generated file that only
      # has a "flutter" key — running from app/ would silently no-op or fail.
      - name: Deploy Firestore rules + indexes (must be READY before code needs them)
        if: hashFiles('firebase.json') != ''
        env:
          FIREBASE_PROJECT_ID: ${{ vars.PROD_PROJECT_ID }}
        run: |
          npm install -g firebase-tools@15
          firebase deploy --only firestore:rules,firestore:indexes \
            --project "${FIREBASE_PROJECT_ID}" --non-interactive

      - name: Deploy Cloud Run revision (NO TRAFFIC, tagged candidate)
        env:
          SERVICE: ${{ vars.PROD_SERVICE_NAME }}
          PROJECT: ${{ vars.PROD_PROJECT_ID }}
          REGION: ${{ vars.PROD_REGION }}
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          gcloud run deploy "${SERVICE}" \
            --project="${PROJECT}" \
            --region="${REGION}" \
            --image="${IMAGE}" \
            --no-traffic --tag=candidate \
            --quiet

      - name: Resolve rc revision URL
        id: rc_url
        env:
          SERVICE: ${{ vars.PROD_SERVICE_NAME }}
          PROJECT: ${{ vars.PROD_PROJECT_ID }}
          REGION: ${{ vars.PROD_REGION }}
        run: |
          # jq, not a gcloud --format projection: gcloud has no first() transform (verified; it errors).
          url=$(gcloud run services describe "${SERVICE}" \
            --project="${PROJECT}" \
            --region="${REGION}" \
            --format=json | jq -r '[.status.traffic[]? | select(.tag == "candidate") | .url] | first // empty')
          if [ -z "${url}" ]; then
            echo "::error::No traffic tag 'candidate' found on ${SERVICE} after the --no-traffic --tag=candidate deploy."
            exit 1
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "rc revision: ${url}"

      - name: Smoke test rc revision (/health)
        env:
          RC_URL: ${{ steps.rc_url.outputs.url }}
        run: |
          curl -fsS --retry 5 --retry-delay 5 "${RC_URL}/health"

  # Mobile release artifacts. These never touch GCP (no WIF, no `environment:
  # prod`) — they just need the tagged source and the PROD_* repo variables
  # that describe how a prod client should be configured. Every prod client
  # build passes --dart-define=FIREBASE_ENV=prod (selects the prod Firebase
  # project's options, see PR #5 `app/lib/app/app_config.dart`) and
  # GOOGLE_WEB_CLIENT_ID from PROD_GOOGLE_WEB_CLIENT_ID.
  build-android:
    name: Build Android AAB
    needs: build-and-stage
    # N1: hashFiles() cannot be used in a job-level `if:` (only step-level) —
    # it fails to parse there. app/pubspec.yaml is committed, so this job
    # always runs; the Flutter build step itself would fail loudly if it ever
    # went missing, which is the desired behavior (no silent skip).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.build-and-stage.outputs.tag }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.5"
          channel: stable

      - name: flutter build appbundle
        working-directory: app
        env:
          # Mobile talks to Cloud Run directly (no Hosting rewrite available).
          API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
          RECAPTCHA_SITE_KEY: ${{ vars.PROD_RECAPTCHA_SITE_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.PROD_GOOGLE_WEB_CLIENT_ID }}
        # NOTE (founder follow-up): app/android's checked-in google-services.json
        # is still dev's — FIREBASE_ENV=prod only switches the Dart-side
        # Firebase options (lib/firebase_options_prod.dart). Native Android
        # SDK init (Google Sign-In, Crashlytics) still reads the dev
        # google-services.json until a prod one is added (flutterfire
        # configure per flavor, or a build-time swap step).
        run: |
          flutter build appbundle --release \
            --dart-define=USE_EMULATORS=false \
            --dart-define=FIREBASE_ENV=prod \
            --dart-define=API_BASE_URL="${API_BASE_URL}" \
            --dart-define=RECAPTCHA_SITE_KEY="${RECAPTCHA_SITE_KEY}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${GOOGLE_WEB_CLIENT_ID}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-aab-${{ needs.build-and-stage.outputs.tag }}
          path: app/build/app/outputs/bundle/release/*.aab
          retention-days: 30

  build-ios:
    name: Build iOS (release tags only — macOS runners are expensive)
    needs: build-and-stage
    # N1: hashFiles() cannot be used in a job-level `if:` — see build-android.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.build-and-stage.outputs.tag }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.5"
          channel: stable

      - name: flutter build ios (no codesign — TestFlight signing is a separate, documented step)
        working-directory: app
        env:
          # Mobile talks to Cloud Run directly (no Hosting rewrite available).
          API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
          RECAPTCHA_SITE_KEY: ${{ vars.PROD_RECAPTCHA_SITE_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.PROD_GOOGLE_WEB_CLIENT_ID }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=USE_EMULATORS=false \
            --dart-define=FIREBASE_ENV=prod \
            --dart-define=API_BASE_URL="${API_BASE_URL}" \
            --dart-define=RECAPTCHA_SITE_KEY="${RECAPTCHA_SITE_KEY}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${GOOGLE_WEB_CLIENT_ID}"
