name: Release prod

# Tag v* (push, or workflow_dispatch run against that tag ref) -> build &
# push image -> deploy to prod Cloud Run with --no-traffic --tag candidate -> smoke
# test the candidate URL -> build mobile release artifacts.
#
# This workflow NEVER shifts prod traffic and NEVER deploys Firebase Hosting.
# Promotion (10% -> 100%, plus the prod web deploy) is a separate, manual
# workflow: `promote-prod.yml`. On GitHub Free (private repo) there is no
# environment required-reviewers and no tag ruleset, so the founder clicking
# "Run workflow" on promote-prod.yml for a given stage IS the human approval
#
# The rule still holds: "Never shift prod traffic without a passing
# production-reviewer verdict" — promote-prod.yml enforces that by requiring
# releases/<tag>-readiness.md to contain `VERDICT: GO`.
#
# Security note (M5/N7): there is deliberately no free-text `tag` input on
# workflow_dispatch — that let any collaborator with write access type an
# arbitrary string. Instead the workflow reads `github.ref_name` /
# `github.ref_type` directly: for `push` it's always the pushed tag; for
# `workflow_dispatch` the operator must pick a tag ref from GitHub's own
# ref selector (a branch selection is rejected in the first step). The
# resolved tag is validated against ^v[0-9]+\.[0-9]+\.[0-9]+$ in the very
# first step, and every subsequent use of it is via `env:` indirection
# (shell variable expansion), never spliced directly into a `run:` script
# via `${{ }}` — so it can't perform script injection against the
# prod-WIF-authenticated steps that follow.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  # Not KO_GO_PATH: ko reads that variable as the path to the `go` binary.
  API_MAIN_PKG: ./cmd/api

jobs:
  build-and-stage:
    concurrency:
      # A newer tag replaces an older pending run while staging is busy.
      group: prod-candidate-staging
      cancel-in-progress: false
    name: Build image, deploy --no-traffic --tag candidate, smoke test
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      rc_url: ${{ steps.rc_url.outputs.url }}
      tag: ${{ steps.tagname.outputs.tag }}
    steps:
      - name: Resolve + validate release tag
        id: tagname
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # N7: no manual tag input — a workflow_dispatch run must itself be
          # targeted at a tag ref (pick it in GitHub's "Use workflow from"
          # ref selector). Reject anything dispatched against a branch.
          if [ "${REF_TYPE}" != "tag" ]; then
            echo "::error::This workflow must run from a tag ref (got ref_type='${REF_TYPE}', ref_name='${REF_NAME}'). For workflow_dispatch, select a tag under 'Use workflow from', not a branch."
            exit 1
          fi
          tag="${REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${tag}' does not match ^v[0-9]+.[0-9]+.[0-9]+\$ — refusing to release."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tagname.outputs.tag }}

      - name: Auth to GCP (WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PROD_DEPLOY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PROD_CI_DEPLOY_SA_EMAIL }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          # Exact Cloud SDK pin (issue #46 / L6); bump with the pinned SHA.
          version: "587.0.0"

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Latest 1.26 patch (stdlib security fixes); go.mod only states the minimum language version.
          go-version: "1.26.11"
          check-latest: true

      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        with:
          # Exact ko pin (issue #46 / L6); the input takes the tag with its leading "v".
          version: v0.19.1

      - name: Build + push image with ko
        id: build
        working-directory: backend
        env:
          KO_DOCKER_REPO: ${{ vars.PROD_ARTIFACT_REGISTRY_URL }}/api # Artifact Registry needs <repo>/<image>
          RELEASE_TAG: ${{ steps.tagname.outputs.tag }}
        run: |
          digest=$(ko build "${API_MAIN_PKG}" --bare -t "${RELEASE_TAG}")
          echo "image=${digest}" >> "$GITHUB_OUTPUT"

      # Deliberately no `working-directory:` here — firebase-tools reads
      # firebase.json from the step's cwd with no upward directory search, so
      # this must run from $GITHUB_WORKSPACE (repo root), which is where the
      # real firebase.json (firestore/storage/hosting config) lives.
      # app/firebase.json is a separate, flutterfire-generated file that only
      # has a "flutter" key — running from app/ would silently no-op or fail.
      - name: Deploy Firestore rules + indexes (must be READY before code needs them)
        if: hashFiles('firebase.json') != ''
        env:
          FIREBASE_PROJECT_ID: ${{ vars.PROD_PROJECT_ID }}
        run: |
          npm install -g firebase-tools@15.32.0
          firebase deploy --only firestore:rules,firestore:indexes \
            --project "${FIREBASE_PROJECT_ID}" --non-interactive

      - name: Deploy Cloud Run revision (NO TRAFFIC, tagged candidate)
        env:
          SERVICE: ${{ vars.PROD_SERVICE_NAME }}
          PROJECT: ${{ vars.PROD_PROJECT_ID }}
          REGION: ${{ vars.PROD_REGION }}
          IMAGE: ${{ steps.build.outputs.image }}
          BILLING_CONFIG_ENABLED: ${{ vars.PROD_BILLING_CONFIG_ENABLED }}
          BILLING_PURCHASES_ENABLED: ${{ vars.PROD_BILLING_PURCHASES_ENABLED }}
          REVENUECAT_PURCHASE_ENVIRONMENT: PRODUCTION
          REVENUECAT_WEBHOOK_APP_IDS: ${{ vars.PROD_REVENUECAT_WEBHOOK_APP_IDS }}
          REVENUECAT_PRODUCTS_JSON: ${{ vars.PROD_REVENUECAT_PRODUCTS_JSON }}
          REVENUECAT_SECRET_API_KEY_REF: ${{ vars.PROD_REVENUECAT_SECRET_API_KEY_REF }}
          REVENUECAT_WEBHOOK_AUTHORIZATION_REF: ${{ vars.PROD_REVENUECAT_WEBHOOK_AUTHORIZATION_REF }}
          REVENUECAT_WEBHOOK_SIGNING_SECRET_REF: ${{ vars.PROD_REVENUECAT_WEBHOOK_SIGNING_SECRET_REF }}
        run: |
          bash scripts/promotion/billing-config.sh > "$RUNNER_TEMP/billing-args"
          mapfile -d '' -t billing_args < "$RUNNER_TEMP/billing-args"
          gcloud run deploy "${SERVICE}" \
            --project="${PROJECT}" \
            --region="${REGION}" \
            --image="${IMAGE}" \
            --no-traffic --tag=candidate "${billing_args[@]}" \
            --quiet

      - name: Resolve candidate revision URL
        id: rc_url
        env:
          SERVICE: ${{ vars.PROD_SERVICE_NAME }}
          PROJECT: ${{ vars.PROD_PROJECT_ID }}
          REGION: ${{ vars.PROD_REGION }}
        run: |
          # jq, not a gcloud --format projection: gcloud has no first() transform (verified; it errors).
          url=$(gcloud run services describe "${SERVICE}" \
            --project="${PROJECT}" \
            --region="${REGION}" \
            --format=json | jq -r '[.status.traffic[]? | select(.tag == "candidate") | .url] | first // empty')
          if [ -z "${url}" ]; then
            echo "::error::No traffic tag 'candidate' found on ${SERVICE} after the --no-traffic --tag=candidate deploy."
            exit 1
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "candidate revision: ${url}"

      - name: Smoke test candidate revision (/health)
        env:
          RC_URL: ${{ steps.rc_url.outputs.url }}
        run: |
          curl -fsS --retry 5 --retry-delay 5 "${RC_URL}/health"

  # Mobile compilation jobs use no GCP identity and no `prod` environment.
  # They need the tagged source and the PROD_* repo variables
  # that describe how a prod client should be configured. Every prod client
  # build passes --dart-define=FIREBASE_ENV=prod (selects the prod Firebase
  # project's options, see PR #5 `app/lib/app/app_config.dart`) and
  # GOOGLE_WEB_CLIENT_ID from PROD_GOOGLE_WEB_CLIENT_ID.
  build-android:
    name: Build Android AAB
    needs: build-and-stage
    permissions:
      contents: read # no id-token: this job builds third-party code (Rust build scripts from the binding PR on) and never touches GCP
    # N1: hashFiles() cannot be used in a job-level `if:` (only step-level) —
    # it fails to parse there. app/pubspec.yaml is committed, so this job
    # always runs; the Flutter build step itself would fail loudly if it ever
    # went missing, which is the desired behavior (no silent skip).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.build-and-stage.outputs.tag }}
          persist-credentials: false

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          version: "3.50.0"
          sha: ab2912035e160d9cad6306df307576da6128ebdb

      # The google-services Gradle plugin reads app/android/app/google-services.json
      # (dzeroth-dev's, used by every other build). Swap in the checked-in prod copy for this
      # job's build only; FIREBASE_ENV=prod alone switches just the Dart-side options. The file
      # is client config (public).
      - name: Use dzeroth-prod google-services.json
        run: |
          set -euo pipefail
          cp app/android/google-services.prod.json app/android/app/google-services.json
          grep -q '"project_id": "dzeroth-prod"' app/android/app/google-services.json \
            || { echo "::error::swapped google-services.json is not dzeroth-prod's"; exit 1; }
          grep -q '"package_name": "com.dzeroth.dzeroth"' app/android/app/google-services.json \
            || { echo "::error::swapped google-services.json has an unexpected package name"; exit 1; }

      # The Android binding of the MLS core lands in a later PR and its Flutter build compiles Rust for each Android ABI:
      # the toolchain and cargo-ndk are needed from that PR on and are harmless before it (cargo-ndk is compiled from
      # crates.io, about 1 to 2 minutes). The Android SDK is preinstalled on the runner image, the NDK Flutter asks for is
      # not (the image ships 27.3, 29.0 and 30.0): the next steps install it. iOS has no Rust setup on purpose: the binding
      # is Android-only.
      - name: Setup Rust (Android targets)
        uses: ./.github/actions/setup-rust
        with:
          version: "1.100.0"
          targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install --locked --version 4.1.2 cargo-ndk

      # Flutter 3.50.0's flutter.ndkVersion; bump together with the Flutter version above (the action fails if they differ).
      - name: Setup Android NDK
        uses: ./.github/actions/setup-android-ndk
        with:
          version: "28.2.13676358"

      - name: Build the unsigned release bundle
        working-directory: app
        env:
          ORG_GRADLE_PROJECT_dzerothExternalReleaseSigning: "true"
          API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
          RECAPTCHA_SITE_KEY: ${{ vars.PROD_RECAPTCHA_SITE_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.PROD_GOOGLE_WEB_CLIENT_ID }}
          BILLING_CONFIG_ENABLED: ${{ vars.PROD_BILLING_CONFIG_ENABLED }}
          REVENUECAT_PRODUCTS_JSON: ${{ vars.PROD_REVENUECAT_PRODUCTS_JSON }}
          REVENUECAT_PUBLIC_API_KEY: ${{ vars.PROD_REVENUECAT_ANDROID_PUBLIC_API_KEY }}
        run: |
          bash ../scripts/promotion/mobile-billing-defines.sh android > "$RUNNER_TEMP/billing.json"
          flutter build appbundle --dart-define-from-file="$RUNNER_TEMP/billing.json" --release \
            --dart-define=USE_EMULATORS=false \
            --dart-define=FIREBASE_ENV=prod \
            --dart-define=API_BASE_URL="${API_BASE_URL}" \
            --dart-define=RECAPTCHA_SITE_KEY="${RECAPTCHA_SITE_KEY}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${GOOGLE_WEB_CLIENT_ID}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-unsigned
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  sign-android:
    name: Sign and verify the Android AAB
    environment: prod
    needs: [build-and-stage, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-unsigned
          path: unsigned

      - name: Sign the bundle with the Play upload key
        env:
          UPLOAD_STORE_BASE64: ${{ secrets.DZEROTH_UPLOAD_STORE_BASE64 }}
          DZEROTH_UPLOAD_STORE_PASSWORD: ${{ secrets.DZEROTH_UPLOAD_STORE_PASSWORD }}
          DZEROTH_UPLOAD_KEY_ALIAS: ${{ secrets.DZEROTH_UPLOAD_KEY_ALIAS }}
          DZEROTH_UPLOAD_KEY_PASSWORD: ${{ secrets.DZEROTH_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          DZEROTH_UPLOAD_STORE_FILE=$(mktemp "$RUNNER_TEMP/upload-key.XXXXXX")
          export DZEROTH_UPLOAD_STORE_FILE
          trap 'rm -f "$DZEROTH_UPLOAD_STORE_FILE"' EXIT
          printf '%s' "${UPLOAD_STORE_BASE64:?Missing Android upload keystore}" | base64 --decode > "$DZEROTH_UPLOAD_STORE_FILE"
          unset UPLOAD_STORE_BASE64
          mkdir signed
          "${JAVA_HOME:?}/bin/jarsigner" -keystore "$DZEROTH_UPLOAD_STORE_FILE" -storepass:env DZEROTH_UPLOAD_STORE_PASSWORD \
            -keypass:env DZEROTH_UPLOAD_KEY_PASSWORD -signedjar signed/app-release.aab \
            unsigned/app-release.aab "$DZEROTH_UPLOAD_KEY_ALIAS"
          "${JAVA_HOME:?}/bin/jarsigner" -verify -strict -keystore "$DZEROTH_UPLOAD_STORE_FILE" -storepass:env DZEROTH_UPLOAD_STORE_PASSWORD \
            signed/app-release.aab "$DZEROTH_UPLOAD_KEY_ALIAS"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: error
          name: android-aab-${{ needs.build-and-stage.outputs.tag }}
          path: signed/app-release.aab
          retention-days: 30

  build-ios:
    name: Build iOS (release tags only — macOS runners are expensive)
    needs: build-and-stage
    # N1: hashFiles() cannot be used in a job-level `if:` — see build-android.
    runs-on: macos-latest
    permissions:
      contents: read # no id-token: this job builds third-party code and never touches GCP
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.build-and-stage.outputs.tag }}
          persist-credentials: false

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          version: "3.50.0"
          sha: ab2912035e160d9cad6306df307576da6128ebdb

      - name: flutter build ios (no codesign — TestFlight signing is a separate, manual step)
        working-directory: app
        env:
          # Mobile talks to Cloud Run directly (no Hosting rewrite available).
          API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
          RECAPTCHA_SITE_KEY: ${{ vars.PROD_RECAPTCHA_SITE_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.PROD_GOOGLE_WEB_CLIENT_ID }}
          BILLING_CONFIG_ENABLED: ${{ vars.PROD_BILLING_CONFIG_ENABLED }}
          REVENUECAT_PRODUCTS_JSON: ${{ vars.PROD_REVENUECAT_PRODUCTS_JSON }}
          REVENUECAT_PUBLIC_API_KEY: ${{ vars.PROD_REVENUECAT_IOS_PUBLIC_API_KEY }}
        run: |
          bash ../scripts/promotion/mobile-billing-defines.sh ios > "$RUNNER_TEMP/billing.json"
          flutter build ios --dart-define-from-file="$RUNNER_TEMP/billing.json" --release --no-codesign \
            --dart-define=USE_EMULATORS=false \
            --dart-define=FIREBASE_ENV=prod \
            --dart-define=API_BASE_URL="${API_BASE_URL}" \
            --dart-define=RECAPTCHA_SITE_KEY="${RECAPTCHA_SITE_KEY}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${GOOGLE_WEB_CLIENT_ID}"
