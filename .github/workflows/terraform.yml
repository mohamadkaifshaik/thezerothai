name: Terraform

# fmt / validate / lint / plan ONLY. This workflow never runs `terraform
# apply` — apply is a deliberate, human-run action (see gcp-terraform skill
# and infra/terraform/envs/*/versions.tf comments) until an ADR adds a gated
# apply pipeline. Plan uses a read-only service account (see modules/iam).

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # WIF for the read-only plan service account
  pull-requests: write # to post the plan as a PR comment

env:
  TF_VERSION: "1.9.8"
  TFLINT_VERSION: "v0.53.0"
  CHECKOV_VERSION: "3.2.257"

jobs:
  plan:
    name: plan (${{ matrix.env }})
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: infra/terraform/envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff ../../

      - name: tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint --init && tflint
        run: |
          tflint --init
          tflint --recursive

      - name: Auth to GCP (WIF, read-only plan SA)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ matrix.env == 'dev' && vars.DEV_PLAN_WORKLOAD_IDENTITY_PROVIDER || vars.PROD_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ matrix.env == 'dev' && vars.DEV_PLAN_SA_EMAIL || vars.PROD_PLAN_SA_EMAIL }}
          create_credentials_file: true

      - name: terraform init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: terraform validate
        run: terraform validate

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform/envs/${{ matrix.env }}
          soft_fail: true # don't block PRs on checkov MEDIUM+ findings yet; surfaced in the PR checks tab
          framework: terraform

      - name: terraform plan
        id: plan
        run: |
          terraform plan -input=false -no-color -out=tfplan \
            -var="project_id=${{ matrix.env == 'dev' && vars.DEV_PROJECT_ID || vars.PROD_PROJECT_ID }}" \
            -var="billing_account=${{ vars.BILLING_ACCOUNT }}" \
            -var="github_repo=${{ github.repository }}" \
            -var="founder_emails=${{ matrix.env == 'dev' && vars.DEV_FOUNDER_EMAILS_JSON || vars.PROD_FOUNDER_EMAILS_JSON }}" \
            -var="hosting_site_id=${{ matrix.env == 'dev' && vars.DEV_HOSTING_SITE_ID || vars.PROD_HOSTING_SITE_ID }}" \
            -var="cors_origins=${{ matrix.env == 'dev' && vars.DEV_CORS_ORIGINS_JSON || vars.PROD_CORS_ORIGINS_JSON }}" \
            | tee plan_output.txt

      - name: Truncate plan for PR comment
        if: github.event_name == 'pull_request'
        run: |
          terraform show -no-color tfplan > plan_full.txt || true
          head -c 60000 plan_full.txt > plan_comment.txt
          echo "" >> plan_comment.txt
          echo "(truncated — full plan in the workflow log)" >> plan_comment.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = [
              `#### Terraform plan — \`${{ matrix.env }}\``,
              '```',
              fs.readFileSync('infra/terraform/envs/${{ matrix.env }}/plan_comment.txt', 'utf8'),
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
