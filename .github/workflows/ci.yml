name: CI

# Runs on every PR. Never applies infrastructure or deploys anything — see
# terraform.yml / deploy-dev.yml / release-prod.yml for those.
#
# Steps are guarded with `hashFiles(...) != ''` so this workflow degrades
# gracefully (skips with a notice) until the backend/frontend Makefile,
# go.mod, and firebase.json land — expected during initial bootstrap, when
# infra, backend and frontend are built out in parallel.

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.35.x"
  BUF_VERSION: "1.47.2"

jobs:
  make-ci:
    name: make ci (lint, vet, unit tests, buf breaking, flutter analyze/test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # buf breaking needs history to diff against main

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}

      # M7: `make ci`'s lint step only runs golangci-lint if it's already on
      # PATH (see Makefile) — install + run it here so CI actually enforces
      # backend/.golangci.yml instead of silently skipping.
      - name: golangci-lint
        if: hashFiles('backend/go.mod') != ''
        uses: golangci/golangci-lint-action@v8
        with:
          # v2 config format. Release binaries must be built with a Go >= go.mod's (1.26); v1.x can't lint it.
          version: v2.14.0
          working-directory: backend
          args: --config=.golangci.yml

      - name: make ci
        if: hashFiles('Makefile') != ''
        run: make ci

      - name: (skip) Makefile not present yet
        if: hashFiles('Makefile') == ''
        run: echo "::warning::No root Makefile yet — backend-developer owns adding 'make ci'. Skipping."

      - name: govulncheck
        if: hashFiles('backend/go.mod') != ''
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend && govulncheck ./...

  emulator-integration:
    name: make test-int (Firebase emulators)
    runs-on: ubuntu-latest
    needs: make-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Firebase emulator binaries
        # The Firestore/Auth/Pub/Sub/Storage-rules emulators are JARs firebase-tools downloads on first
        # use (testing-strategy skill "CI cost": "cache ... the emulator JARs"). Keyed on the pinned
        # firebase-tools major version below plus firebase.json (the emulators it starts); restore-keys
        # falls back to any cache for this OS/version if firebase.json changes so a config tweak doesn't
        # cost a full re-download.
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v13-${{ hashFiles('firebase.json') }}
          restore-keys: |
            firebase-emulators-${{ runner.os }}-v13-

      - name: Install firebase-tools
        run: npm install -g firebase-tools@13

      - name: make test-int
        if: hashFiles('Makefile') != '' && hashFiles('firebase.json') != ''
        run: make test-int

      - name: (skip) Makefile or firebase.json not present yet
        if: hashFiles('Makefile') == '' || hashFiles('firebase.json') == ''
        run: echo "::warning::Makefile and/or firebase.json not present yet — skipping emulator integration tests."
