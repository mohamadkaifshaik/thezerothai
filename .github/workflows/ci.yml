name: CI

# Runs on every PR. Never applies infrastructure or deploys anything — see
# terraform.yml / deploy-dev.yml / release-prod.yml for those.
#
# `make ci` and `make test-int` run as parallel jobs that call the same Makefile targets a local `make ci` /
# `make test-int` runs. The three slow suites are split into shards by scripts/ci/shard.sh (disjoint, together every
# test; the shard count is the length of each `matrix.shard` list):
#   flutter test    6 shards, test files bin-packed by measured time        make flutter-test SHARD=i/n
#   go unit tests   3 shards, Go packages bin-packed by measured time       make test-shard SHARD=i/n, gate: make test-cover
#   test-int        6 shards, test names bin-packed by estimated time       make test-int-shard SHARD=i/n, gate: make test-int-cover
# The timings are scripts/ci/timings/*.tsv (refresh: scripts/ci/refresh-timings.sh); an item without one is estimated from its size.
# The `changes` job (scripts/ci/changed-groups.sh) lists the job groups a pull request needs. A group it does not need is
# skipped, and the summary jobs below count a skipped group as passed only when `changes` said so. Anything unknown, shared
# or unreadable runs everything.
# Gate and summary jobs report the results under the check names these jobs had before the split: the main ruleset
# requires "make ci (...)", "make test-int (Firebase emulators)" and "promotion scripts (...)" by name.
# The MLS core (crypto/, Rust) has its own group: `crypto` (fmt, clippy, tests, cargo-deny, wasm build and browser test)
# is counted by `make ci` below; `crypto-web-integration` (Flutter web test over the worker) is advisory, not counted.
# `android-build` (group `android`: the Android debug build on Linux, which compiles the Rust binding with cargo-ndk) is counted.
# About 23 jobs per run, up to 20 at once: on a plan with a 20-job concurrency limit, parallel PRs queue.

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.0"
  # Flutter 3.50.0's flutter.ndkVersion (the NDK the Android build requires). The runner image does not ship it, so
  # .github/actions/setup-android-ndk installs it and fails if the Flutter SDK asks for another one: bump with FLUTTER_VERSION.
  ANDROID_NDK_VERSION: "28.2.13676358"
  # Keep in step with crypto/rust-toolchain.toml (.github/actions/setup-rust checks it and fails if they differ).
  RUST_VERSION: "1.100.0"
  BUF_VERSION: "1.47.2"
  # Keep in step with the npx pin in the Makefile (FIREBASE).
  FIREBASE_TOOLS_VERSION: "15.32.0"

jobs:
  # Which job groups this change needs. Job-level `if:` only (never `on.pull_request.paths`: a workflow that does not run
  # leaves a required check pending forever). Fail open: anything but a clean pull_request diff turns every group on.
  changes:
    name: changes (which job groups this change needs)
    runs-on: ubuntu-latest
    outputs:
      go_checks: ${{ steps.groups.outputs.go_checks }}
      go_unit: ${{ steps.groups.outputs.go_unit }}
      int: ${{ steps.groups.outputs.int }}
      flutter: ${{ steps.groups.outputs.flutter }}
      promotion: ${{ steps.groups.outputs.promotion }}
      crypto: ${{ steps.groups.outputs.crypto }}
      android: ${{ steps.groups.outputs.android }}
    steps:
      # A pull_request run checks out the merge of the PR into its base: HEAD is that merge commit and HEAD^1 the base tip,
      # so `git diff HEAD^1 HEAD` is exactly what the PR changes, even if the base moved since the PR was opened.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          filter: blob:none # `git diff --name-only --no-renames` reads trees only
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: Classify the changed paths
        id: groups
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -o pipefail
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "event $EVENT_NAME: every group on"
            bash scripts/ci/changed-groups.sh --all >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Not a two-parent merge commit, or git cannot diff it: run everything rather than guess.
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" != 3 ] ||
            ! git -c core.quotepath=off diff --name-only --no-renames HEAD^1 HEAD >"$RUNNER_TEMP/changed.txt"; then
            echo "::warning::could not diff the pull request: every group on"
            bash scripts/ci/changed-groups.sh --all >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed paths:"
          sed 's/^/  /' "$RUNNER_TEMP/changed.txt"
          bash scripts/ci/changed-groups.sh <"$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"

  go-checks:
    name: go checks (gofmt, vet, golangci-lint, buf lint/breaking, govulncheck, osv-scanner)
    needs: [changes]
    if: needs.changes.outputs.go_checks != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # buf breaking needs history to diff against main

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned patch: 1.26.11 fixes GO-2026-6859 (net/http); 1.26.10 fixed GO-2026-6809 (crypto/x509). Bump with each 1.26 security release; go.mod only states the minimum language version.
          go-version: "1.26.11"
          check-latest: true
          # setup-go only looks for go.sum/go.mod at the repo root; the module lives in backend/, so name it (otherwise the cache step warns and saves nothing).
          cache-dependency-path: backend/go.sum

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: ${{ env.BUF_VERSION }}
          # An authenticated GitHub API call: the anonymous one is rate-limited per runner IP and failed a run ("API rate limit exceeded").
          github_token: ${{ github.token }}

      # M7: `make lint` only runs golangci-lint if it's already on PATH (see Makefile), so install + run it here and CI
      # actually enforces backend/.golangci.yml instead of silently skipping.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # v2 config format. Release binaries must be built with a Go >= go.mod's (1.26); v1.x can't lint it.
          version: v2.14.0
          working-directory: backend
          args: --config=.golangci.yml

      - name: make fmt vet buf-check
        run: make fmt vet buf-check

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          cd backend && govulncheck ./...

      # Exact release binary, sha256-verified (osv-scanner has no Dependabot ecosystem; bump per
      #  Scans lock files only, so it needs no Go/Flutter toolchain state.
      # Fails on ANY finding not listed in osv-scanner.toml (narrow, expiring ignores). Reachability
      # analysis is off: govulncheck above is the reachability gate, and this step must be deterministic.
      - name: osv-scanner (go.mod + pubspec.lock)
        env:
          OSV_SCANNER_VERSION: v2.6.0
          OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
        run: |
          curl -fsSL -o /tmp/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  /tmp/osv-scanner" | sha256sum -c -
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner scan --config=osv-scanner.toml --no-call-analysis=go \
            -L backend/go.mod -L app/pubspec.lock

  # `make test` split by package (scripts/ci/shard.sh go-packages): most of its time is compiling race test binaries,
  # which a split by test name would repeat in every shard. Each shard uploads its pkg/platform profile; go-unit gates them.
  go-unit-shard:
    name: go unit tests (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    needs: [changes]
    if: needs.changes.outputs.go_unit != 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # report every failing shard, not just the first
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned patch: 1.26.11 fixes GO-2026-6859 (net/http); 1.26.10 fixed GO-2026-6809 (crypto/x509). Bump with each 1.26 security release; go.mod only states the minimum language version.
          go-version: "1.26.11"
          check-latest: true
          cache-dependency-path: backend/go.sum

      - name: make test-shard
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: make test-shard SHARD="$SHARD"

      - name: Upload this shard's coverage profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-platform-shard-${{ matrix.shard }}-of-${{ strategy.job-total }}
          path: backend/cover-platform-shard-${{ matrix.shard }}-of-${{ strategy.job-total }}.out
          if-no-files-found: error
          retention-days: 1

  # The go unit tests under the check name they had before the split, plus the pkg/platform 70% coverage gate, which only
  # means something over all shards together. As make-ci below: fail, never skip, when a shard did not succeed.
  go-unit:
    name: go unit tests (race, pkg/platform coverage gate)
    needs: [changes, go-unit-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # A skipped shard group passes only when `changes` skipped it on purpose; a failed `changes` job fails this one.
      - name: Every go unit test shard succeeded
        id: shards
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e '.changes.result == "success" and
            .["go-unit-shard"].result == (if .changes.outputs.go_unit == "false" then "skipped" else "success" end)' <<<"$NEEDS" >/dev/null || {
            echo "::error::go unit tests failed: a shard did not succeed (see its job log)"
            exit 1
          }
          echo "run=$(jq -r '.changes.outputs.go_unit != "false"' <<<"$NEEDS")" >>"$GITHUB_OUTPUT"

      # `go tool cover` reads the source files of the profiled packages, so the gate needs backend/ and Go (not the module
      # cache: it only reads sources and `go list` metadata, so this job skips the cache restore and the rest of the tree).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.shards.outputs.run == 'true'
        with:
          sparse-checkout: |
            backend
            scripts/ci

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.shards.outputs.run == 'true'
        with:
          # Pinned patch: 1.26.11 fixes GO-2026-6859 (net/http); 1.26.10 fixed GO-2026-6809 (crypto/x509). Bump with each 1.26 security release; go.mod only states the minimum language version.
          go-version: "1.26.11"
          check-latest: true
          cache: false

      - name: Download the shard coverage profiles
        if: steps.shards.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cover-platform-shard-*
          path: backend
          merge-multiple: true

      # cover.sh merge fails unless it gets exactly one profile for every shard index 0..n-1.
      - name: make test-cover
        if: steps.shards.outputs.run == 'true'
        run: make test-cover

  flutter-analyze:
    name: flutter analyze (and CSP loader hashes)
    needs: [changes]
    if: needs.changes.outputs.flutter != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}
          sha: ab2912035e160d9cad6306df307576da6128ebdb

      - name: make flutter-analyze
        run: make flutter-analyze

  flutter-test:
    name: flutter test (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    needs: [changes]
    if: needs.changes.outputs.flutter != 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # report every failing shard, not just the first
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}
          sha: ab2912035e160d9cad6306df307576da6128ebdb

      - name: make flutter-test
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: make flutter-test SHARD="$SHARD"

  # The MLS core (Rust). `make crypto-test` = rustfmt, clippy, host tests (vectors replay included) and cargo deny; then the
  # wasm build and the binding's own test in headless Chrome (the chromedriver and Chrome preinstalled on the runner image).
  crypto:
    name: crypto (MLS core - fmt, clippy, tests, cargo-deny, wasm build, browser test)
    needs: [changes]
    if: needs.changes.outputs.crypto != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          version: ${{ env.RUST_VERSION }}
          components: rustfmt clippy
          targets: wasm32-unknown-unknown
          wasm-bindgen: "true"
          cargo-deny: "true"

      - name: Cache cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crypto/target
          key: crypto-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('crypto/Cargo.lock') }}
          restore-keys: |
            crypto-${{ runner.os }}-${{ env.RUST_VERSION }}-

      # `make crypto-test` skips cargo-deny when it is missing (as `make lint` skips golangci-lint); in CI that must not pass silently.
      - name: cargo-deny is installed
        run: cargo-deny --version

      - name: make crypto-test
        run: make crypto-test

      - name: make crypto-web
        run: make crypto-web

      - name: wasm binding test (headless Chrome)
        run: |
          driver="${CHROMEWEBDRIVER:-}/chromedriver"
          [ -x "$driver" ] || { echo "::error::no chromedriver at $driver (the runner image changed?)"; exit 1; }
          cd crypto
          CHROMEDRIVER="$driver" cargo test -p dzmls_web --target wasm32-unknown-unknown

  # The Dart WebCryptoEngine over the real worker, in Chrome through `flutter drive`. Advisory: it is not listed in make-ci,
  # so it cannot block a merge. It builds Rust and Flutter web and drives a browser, the heaviest and most flaky-prone job
  # here. Add it to make-ci (needs + the jq pair list) once it has been green for a few weeks.
  # It must stay OUT of make-ci's `needs`: that job only reads the results of the jobs it lists, so a failed, cancelled or
  # skipped crypto-web-integration cannot turn the required `make ci (...)` check red. Do not add it there by accident.
  crypto-web-integration:
    name: crypto web integration (flutter drive over the MLS worker; advisory)
    needs: [changes]
    if: needs.changes.outputs.crypto != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          version: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
          wasm-bindgen: "true"

      - name: Cache cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crypto/target
          key: crypto-web-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('crypto/Cargo.lock') }}
          restore-keys: |
            crypto-web-${{ runner.os }}-${{ env.RUST_VERSION }}-

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}
          sha: ab2912035e160d9cad6306df307576da6128ebdb

      - name: make crypto-web
        run: make crypto-web

      - name: flutter drive (WebCryptoEngine in Chrome)
        run: |
          driver="${CHROMEWEBDRIVER:-}/chromedriver"
          [ -x "$driver" ] || { echo "::error::no chromedriver at $driver (the runner image changed?)"; exit 1; }
          "$driver" --port=4455 &
          trap 'kill $!' EXIT
          cd app
          flutter drive --driver=test_driver/integration_test.dart             --target=integration_test/crypto_engine_test.dart             -d web-server --browser-name=chrome --driver-port=4455 --headless

  # The Android debug build on Linux: Gradle runs `cargo ndk` for the Rust binding (app/rust_builder) for the three ABIs.
  # Pull-request CI otherwise never builds Android, so the first Linux build would be a release. No secrets, no environment.
  android-build:
    name: android build (debug APK on Linux, Rust via cargo-ndk, 16 KB page alignment)
    needs: [changes]
    if: needs.changes.outputs.android != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Java: the runner's default (17), which AGP 9.1 / Gradle 9.3 and the app's JavaVersion.VERSION_17 accept; release-prod.yml does the same.
      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}
          sha: ab2912035e160d9cad6306df307576da6128ebdb

      - name: Setup Rust (Android targets)
        uses: ./.github/actions/setup-rust
        with:
          version: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Cache cargo registry, cargo-ndk and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-ndk
            app/rust/target
          key: android-${{ runner.os }}-${{ env.RUST_VERSION }}-cargo-ndk-4.1.2-${{ hashFiles('app/rust/Cargo.lock', 'crypto/Cargo.lock', 'app/rust/rust-toolchain.toml', 'crypto/rust-toolchain.toml') }}
          restore-keys: |
            android-${{ runner.os }}-${{ env.RUST_VERSION }}-cargo-ndk-4.1.2-

      - name: Install cargo-ndk
        run: |
          # The binary refuses to run unless cargo starts it: always `cargo ndk`, never `cargo-ndk`.
          if cargo ndk --version 2>/dev/null | grep -qF "4.1.2"; then
            echo "cargo-ndk 4.1.2 restored from the cache"
          else
            cargo install --locked --version 4.1.2 cargo-ndk
          fi
          cargo ndk --version

      # The runner image ships NDK 27.3, 29.0 and 30.0, not Flutter's 28.2: install exactly that one (not cached: about 1.5 GB unpacked).
      - name: Setup Android NDK
        uses: ./.github/actions/setup-android-ndk
        with:
          version: ${{ env.ANDROID_NDK_VERSION }}

      # No --dart-define is needed to compile: every String.fromEnvironment has a default, and app/android/app/google-services.json is committed.
      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: flutter build apk --debug (arm, arm64, x64)
        working-directory: app
        run: flutter build apk --debug --target-platform android-arm,android-arm64,android-x64

      - name: The APK carries the Rust library for every ABI, 16 KB aligned
        run: |
          set -euo pipefail
          apk=app/build/app/outputs/flutter-apk/app-debug.apk
          [ -f "$apk" ] || { echo "::error::$apk was not built"; exit 1; }
          listing=$(unzip -l "$apk")
          for abi in arm64-v8a armeabi-v7a x86_64; do
            lib="lib/$abi/libdzmls_flutter.so"
            line=$(grep -F " $lib" <<<"$listing" | head -n 1 || true)
            [ -n "$line" ] || { echo "::error::$lib is not in the APK"; exit 1; }
            echo "$lib: $(awk '{print $1}' <<<"$line") bytes"
          done
          # Android 15+ devices with 16 KB pages need every LOAD segment of a 64-bit library aligned to 0x4000.
          work=$(mktemp -d)
          for abi in arm64-v8a x86_64; do
            unzip -p "$apk" "lib/$abi/libdzmls_flutter.so" >"$work/$abi.so"
            aligns=$(readelf -lW "$work/$abi.so" | awk '$1 == "LOAD" {print $NF}')
            echo "$abi LOAD alignments: ${aligns//$'\n'/ }"
            [ -n "$aligns" ] || { echo "::error::no LOAD segments found in the $abi library"; exit 1; }
            if [ -n "$(grep -vx '0x4000' <<<"$aligns" || true)" ]; then
              echo "::error::the $abi libdzmls_flutter.so has a LOAD segment not aligned to 0x4000 (16 KB pages)"
              exit 1
            fi
          done

  # Summary under the required check name. always(): GitHub counts a skipped required check as passed, so this job must
  # run, and fail, when any job above failed or was cancelled. A job is expected to be `skipped` exactly when `changes`
  # turned its group off, and `success` otherwise; a failed `changes` job fails this one (its skipped dependants must not
  # read as passed). go-unit runs always() itself, so it is always expected to succeed. Re-running failed jobs re-runs this one too.
  make-ci:
    name: make ci (lint, vet, unit tests, buf breaking, flutter analyze/test)
    needs: [changes, go-checks, go-unit-shard, go-unit, flutter-analyze, flutter-test, crypto, android-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every make ci job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e '. as $n | $n.changes.result == "success" and $n["go-unit"].result == "success" and
            ($n.changes.outputs as $o | [["go-checks", "go_checks"], ["go-unit-shard", "go_unit"], ["flutter-analyze", "flutter"], ["flutter-test", "flutter"], ["crypto", "crypto"], ["android-build", "android"]] |
              all(.[]; . as [$job, $flag] | $n[$job].result == (if $o[$flag] == "false" then "skipped" else "success" end)))' <<<"$NEEDS" >/dev/null || {
            echo "::error::make ci failed: a job above did not succeed (see the results listed in this step)"
            exit 1
          }

  test-int-shard:
    name: make test-int (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    # Needs only `changes` (cheap, first): these jobs use nothing from the make ci jobs (own checkout, toolchains and
    # coverage files; generated code is committed), so everything else runs in parallel.
    needs: [changes]
    if: needs.changes.outputs.int != 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # report every failing shard, not just the first
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned patch: 1.26.11 fixes GO-2026-6859 (net/http); 1.26.10 fixed GO-2026-6809 (crypto/x509). Bump with each 1.26 security release; go.mod only states the minimum language version.
          go-version: "1.26.11"
          check-latest: true
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21" # firebase-tools 15 requires Java >= 21

      - name: Cache Firebase emulator binaries
        # The Firestore/Auth/Pub/Sub/Storage-rules emulators are JARs firebase-tools downloads on first
        # use ("cache ... the emulator JARs"). Keyed on the pinned
        # firebase-tools major version below plus firebase.json (the emulators it starts); restore-keys
        # falls back to any cache for this OS/version if firebase.json changes so a config tweak doesn't
        # cost a full re-download.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v15-${{ hashFiles('firebase.json') }}
          restore-keys: |
            firebase-emulators-${{ runner.os }}-v15-

      # firebase-tools (about 20 s of npm install) lives in its own npm prefix, cached per Node and firebase-tools version.
      # The install step still checks the version it finds, so a bad or partial cache restore re-installs instead of failing.
      - name: Node version (cache key)
        id: node
        run: echo "version=$(node --version)" >>"$GITHUB_OUTPUT"

      - name: Cache firebase-tools
        id: fbt
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase-tools-npm
          key: firebase-tools-${{ runner.os }}-node${{ steps.node.outputs.version }}-${{ env.FIREBASE_TOOLS_VERSION }}

      - name: Install firebase-tools
        run: |
          prefix="$HOME/.cache/firebase-tools-npm"
          if [ "$(PATH="$prefix/bin:$PATH" firebase --version 2>/dev/null | tail -n 1)" != "$FIREBASE_TOOLS_VERSION" ]; then
            npm install -g --prefix "$prefix" "firebase-tools@${FIREBASE_TOOLS_VERSION}"
          fi
          echo "$prefix/bin" >>"$GITHUB_PATH"
          PATH="$prefix/bin:$PATH" firebase --version

      - name: make test-int-shard
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: make test-int-shard SHARD="$SHARD"

      - name: Upload this shard's coverage profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-internal-shard-${{ matrix.shard }}-of-${{ strategy.job-total }}
          path: backend/cover-internal-shard-${{ matrix.shard }}-of-${{ strategy.job-total }}.out
          if-no-files-found: error
          retention-days: 1

  # Summary under the required check name test-int had before the split,
  # plus the internal/ 70% coverage gate, which only means something over all shards together.
  emulator-integration:
    name: make test-int (Firebase emulators)
    needs: [changes, test-int-shard]
    if: always() # as make-ci above: fail, never skip, when a shard did not succeed; skipped shards pass only if `changes` said so
    runs-on: ubuntu-latest
    steps:
      - name: Every test-int shard succeeded
        id: shards
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e '.changes.result == "success" and
            .["test-int-shard"].result == (if .changes.outputs.int == "false" then "skipped" else "success" end)' <<<"$NEEDS" >/dev/null || {
            echo "::error::make test-int failed: a shard did not succeed (see its job log)"
            exit 1
          }
          echo "run=$(jq -r '.changes.outputs.int != "false"' <<<"$NEEDS")" >>"$GITHUB_OUTPUT"

      # As go-unit above: backend/ and Go, no module cache.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.shards.outputs.run == 'true'
        with:
          sparse-checkout: |
            backend
            scripts/ci

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.shards.outputs.run == 'true'
        with:
          # Pinned patch: 1.26.11 fixes GO-2026-6859 (net/http); 1.26.10 fixed GO-2026-6809 (crypto/x509). Bump with each 1.26 security release; go.mod only states the minimum language version.
          go-version: "1.26.11"
          check-latest: true
          cache: false

      - name: Download the shard coverage profiles
        if: steps.shards.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cover-internal-shard-*
          path: backend
          merge-multiple: true

      - name: make test-int-cover
        if: steps.shards.outputs.run == 'true'
        run: make test-int-cover

  # Release-process scripts (scripts/promotion) and the CI shard scripts (scripts/ci). Pure shell + jq; no credentials, no
  # GCP access: this job has the workflow's read-only `contents` permission and no id-token.
  promotion-scripts:
    name: promotion scripts (shellcheck, actionlint, fixture tests, flag registry)
    needs: [changes]
    if: always() # required check: runs (cheaply) even when `changes` turned its checks off, and fails if `changes` failed
    runs-on: ubuntu-latest
    steps:
      - name: Does this change need the promotion script checks
        id: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -e '.changes.result == "success"' <<<"$NEEDS" >/dev/null || {
            echo "::error::the changes job did not succeed, so the groups this change needs are unknown"
            exit 1
          }
          echo "run=$(jq -r '.changes.outputs.promotion != "false"' <<<"$NEEDS")" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Exact release binaries, sha256-verified (same approach as osv-scanner above; bump per
      #  actionlint's hash matches the project's published checksums file;
      # shellcheck publishes no checksum file, so its hash was computed from the release asset when pinned.
      - name: Install shellcheck + actionlint
        if: steps.gate.outputs.run == 'true'
        env:
          SHELLCHECK_VERSION: v0.10.0
          SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" "$RUNNER_TEMP/bin/"
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: shellcheck
        if: steps.gate.outputs.run == 'true'
        run: shellcheck -x -P SCRIPTDIR -S warning scripts/promotion/*.sh scripts/promotion/test/*.sh scripts/promotion/test/fakebin/* scripts/ci/*.sh scripts/ci/test/*.sh

      - name: actionlint
        if: steps.gate.outputs.run == 'true'
        run: actionlint

      - name: Fixture tests
        if: steps.gate.outputs.run == 'true'
        # The three suites run side by side (own temp dirs and logs), logs printed in order; any failure fails the step.
        run: bash scripts/ci/run-fixture-tests.sh

      - name: fieldOverrides changes are acknowledged
        if: steps.gate.outputs.run == 'true'
        run: bash scripts/promotion/check-field-overrides.sh firebase/firestore.indexes.json firebase/field-overrides.ack

      - name: Flag registry matches config.go, ceiling and Terraform
        if: steps.gate.outputs.run == 'true'
        run: |
          bash scripts/promotion/check-flag-registry.sh backend/pkg/platform/config/config.go \
            scripts/promotion/flag-ceiling.json infra/terraform/envs/dev/main.tf infra/terraform/envs/prod/main.tf

      # ADR-0022: a time-boxed credit-mode marker (until:YYYY-MM-DD) in infra/terraform must not outlive its date (UTC).
      # Runs on every pull request (no `changes` gating) so it goes red everywhere the day after a date.
      # Red from the day after a date means: revert that line (or renew it by a new decision), do not delete this step.
      - name: No expired until-markers in infra/terraform (ADR-0022)
        run: bash scripts/promotion/check-until-dates.sh infra/terraform
