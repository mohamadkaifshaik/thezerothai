name: CI

# Runs on every PR. Never applies infrastructure or deploys anything — see
# terraform.yml / deploy-dev.yml / release-prod.yml for those.
#
# `make ci` and `make test-int` run as parallel jobs that call the same Makefile targets a local `make ci` /
# `make test-int` runs. flutter test and test-int, the two slow suites, are split into shards by
# scripts/ci/shard.sh (round robin, disjoint, together every test); the shard count is the length of each `matrix.shard`
# list. Two summary jobs report the results under the check names these jobs had before the split: the main ruleset
# requires "make ci (...)" by name (docs/runbooks/ci-enforcement.md, section 11).

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"
  BUF_VERSION: "1.47.2"

jobs:
  go-checks:
    name: go checks (gofmt, vet, golangci-lint, buf lint/breaking, govulncheck, osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # buf breaking needs history to diff against main

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned patch: 1.26.10 fixes GO-2026-6809 (crypto/x509). Bump with each 1.26 security release; go.mod only states the minimum language version.
          go-version: "1.26.10"
          check-latest: true
          # setup-go only looks for go.sum/go.mod at the repo root; the module lives in backend/, so name it (otherwise the cache step warns and saves nothing).
          cache-dependency-path: backend/go.sum

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: ${{ env.BUF_VERSION }}
          # An authenticated GitHub API call: the anonymous one is rate-limited per runner IP and failed a run ("API rate limit exceeded").
          github_token: ${{ github.token }}

      # M7: `make lint` only runs golangci-lint if it's already on PATH (see Makefile), so install + run it here and CI
      # actually enforces backend/.golangci.yml instead of silently skipping.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # v2 config format. Release binaries must be built with a Go >= go.mod's (1.26); v1.x can't lint it.
          version: v2.14.0
          working-directory: backend
          args: --config=.golangci.yml

      - name: make fmt vet buf-check
        run: make fmt vet buf-check

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          cd backend && govulncheck ./...

      # Exact release binary, sha256-verified (osv-scanner has no Dependabot ecosystem; bump per
      # docs/runbooks/dependency-updates.md). Scans lock files only, so it needs no Go/Flutter toolchain state.
      # Fails on ANY finding not listed in osv-scanner.toml (narrow, expiring ignores). Reachability
      # analysis is off: govulncheck above is the reachability gate, and this step must be deterministic.
      - name: osv-scanner (go.mod + pubspec.lock)
        env:
          OSV_SCANNER_VERSION: v2.6.0
          OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
        run: |
          curl -fsSL -o /tmp/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  /tmp/osv-scanner" | sha256sum -c -
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner scan --config=osv-scanner.toml --no-call-analysis=go \
            -L backend/go.mod -L app/pubspec.lock

  go-unit:
    name: go unit tests (race, pkg/platform coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned patch: 1.26.10 fixes GO-2026-6809 (crypto/x509). Bump with each 1.26 security release; go.mod only states the minimum language version.
          go-version: "1.26.10"
          check-latest: true
          cache-dependency-path: backend/go.sum

      - name: make test
        run: make test

  flutter-analyze:
    name: flutter analyze (and CSP loader hashes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}
          sha: 6a19cca56475dbfba1478ee68d7bd0c2ef891da1

      - name: make flutter-analyze
        run: make flutter-analyze

  flutter-test:
    name: flutter test (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # report every failing shard, not just the first
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}
          sha: 6a19cca56475dbfba1478ee68d7bd0c2ef891da1

      - name: make flutter-test
        run: make flutter-test SHARD=${{ matrix.shard }}/${{ strategy.job-total }}

  # Summary under the required check name. always(): GitHub counts a skipped required check as passed, so this job must
  # run, and fail, when any job above failed, was cancelled or was skipped. Re-running failed jobs re-runs this one too.
  make-ci:
    name: make ci (lint, vet, unit tests, buf breaking, flutter analyze/test)
    needs: [go-checks, go-unit, flutter-analyze, flutter-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every make ci job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null || {
            echo "::error::make ci failed: a job above did not succeed (see the results listed in this step)"
            exit 1
          }

  test-int-shard:
    name: make test-int (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # No `needs:`: these jobs use nothing from the make ci jobs (own checkout, toolchains and coverage files; generated code
    # is committed), so everything runs in parallel and every job always reports a result.
    strategy:
      fail-fast: false # report every failing shard, not just the first
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned patch: 1.26.10 fixes GO-2026-6809 (crypto/x509). Bump with each 1.26 security release; go.mod only states the minimum language version.
          go-version: "1.26.10"
          check-latest: true
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21" # firebase-tools 15 requires Java >= 21

      - name: Cache Firebase emulator binaries
        # The Firestore/Auth/Pub/Sub/Storage-rules emulators are JARs firebase-tools downloads on first
        # use (testing-strategy skill "CI cost": "cache ... the emulator JARs"). Keyed on the pinned
        # firebase-tools major version below plus firebase.json (the emulators it starts); restore-keys
        # falls back to any cache for this OS/version if firebase.json changes so a config tweak doesn't
        # cost a full re-download.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v15-${{ hashFiles('firebase.json') }}
          restore-keys: |
            firebase-emulators-${{ runner.os }}-v15-

      - name: Install firebase-tools
        run: npm install -g firebase-tools@15.32.0

      - name: make test-int-shard
        run: make test-int-shard SHARD=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload this shard's coverage profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-internal-shard-${{ matrix.shard }}-of-${{ strategy.job-total }}
          path: backend/cover-internal-shard-${{ matrix.shard }}-of-${{ strategy.job-total }}.out
          if-no-files-found: error
          retention-days: 1

  # Summary under the check name test-int had before the split (not a required check: docs/runbooks/ci-enforcement.md),
  # plus the internal/ 70% coverage gate, which only means something over all shards together.
  emulator-integration:
    name: make test-int (Firebase emulators)
    needs: [test-int-shard]
    if: always() # as make-ci above: fail, never skip, when a shard did not succeed
    runs-on: ubuntu-latest
    steps:
      - name: Every test-int shard succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null || {
            echo "::error::make test-int failed: a shard did not succeed (see its job log)"
            exit 1
          }

      # `go tool cover` reads the source files of the profiled packages, so the gate needs the checkout and Go.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned patch: 1.26.10 fixes GO-2026-6809 (crypto/x509). Bump with each 1.26 security release; go.mod only states the minimum language version.
          go-version: "1.26.10"
          check-latest: true
          cache-dependency-path: backend/go.sum

      - name: Download the shard coverage profiles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cover-internal-shard-*
          path: backend
          merge-multiple: true

      - name: make test-int-cover
        run: make test-int-cover

  # Release-process scripts (scripts/promotion) and the CI shard scripts (scripts/ci). Pure shell + jq; no credentials, no
  # GCP access: this job has the workflow's read-only `contents` permission and no id-token.
  promotion-scripts:
    name: promotion scripts (shellcheck, actionlint, fixture tests, flag registry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Exact release binaries, sha256-verified (same approach as osv-scanner above; bump per
      # docs/runbooks/dependency-updates.md). actionlint's hash matches the project's published checksums file;
      # shellcheck publishes no checksum file, so its hash was computed from the release asset when pinned.
      - name: Install shellcheck + actionlint
        env:
          SHELLCHECK_VERSION: v0.10.0
          SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" "$RUNNER_TEMP/bin/"
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: shellcheck
        run: shellcheck -x -P SCRIPTDIR -S warning scripts/promotion/*.sh scripts/promotion/test/*.sh scripts/promotion/test/fakebin/* scripts/ci/*.sh scripts/ci/test/*.sh

      - name: actionlint
        run: actionlint

      - name: Fixture tests
        run: |
          bash scripts/promotion/test/run.sh
          bash scripts/promotion/test/promote-test.sh
          bash scripts/ci/test/run.sh

      - name: fieldOverrides changes are acknowledged
        run: bash scripts/promotion/check-field-overrides.sh firebase/firestore.indexes.json firebase/field-overrides.ack

      - name: Flag registry matches config.go, ceiling and Terraform
        run: |
          bash scripts/promotion/check-flag-registry.sh backend/pkg/platform/config/config.go \
            scripts/promotion/flag-ceiling.json infra/terraform/envs/dev/main.tf infra/terraform/envs/prod/main.tf

      # ADR-0022: a time-boxed credit-mode marker (until:YYYY-MM-DD) in infra/terraform must not outlive its date (UTC).
      # Red from the day after a date means: revert that line (or renew it by a new decision), do not delete this step.
      - name: No expired until-markers in infra/terraform (ADR-0022)
        run: bash scripts/promotion/check-until-dates.sh infra/terraform
