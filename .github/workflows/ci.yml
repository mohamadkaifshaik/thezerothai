name: CI

# Runs on every PR. Never applies infrastructure or deploys anything — see
# terraform.yml / deploy-dev.yml / release-prod.yml for those.
#
# Steps are guarded with `hashFiles(...) != ''` so this workflow degrades
# gracefully (skips with a notice) until the backend/frontend Makefile,
# go.mod, and firebase.json land — expected during initial bootstrap, when
# infra, backend and frontend are built out in parallel.

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"
  BUF_VERSION: "1.47.2"

jobs:
  make-ci:
    name: make ci (lint, vet, unit tests, buf breaking, flutter analyze/test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # buf breaking needs history to diff against main

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Latest 1.26 patch (stdlib security fixes); go.mod only states the minimum language version.
          go-version: "1.26.x"
          check-latest: true
          cache: false

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}
          sha: 6a19cca56475dbfba1478ee68d7bd0c2ef891da1

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: ${{ env.BUF_VERSION }}

      # M7: `make ci`'s lint step only runs golangci-lint if it's already on
      # PATH (see Makefile) — install + run it here so CI actually enforces
      # backend/.golangci.yml instead of silently skipping.
      - name: golangci-lint
        if: hashFiles('backend/go.mod') != ''
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # v2 config format. Release binaries must be built with a Go >= go.mod's (1.26); v1.x can't lint it.
          version: v2.14.0
          working-directory: backend
          args: --config=.golangci.yml

      - name: make ci
        if: hashFiles('Makefile') != ''
        run: make ci

      - name: (skip) Makefile not present yet
        if: hashFiles('Makefile') == ''
        run: echo "::warning::No root Makefile yet — backend-developer owns adding 'make ci'. Skipping."

      - name: govulncheck
        if: hashFiles('backend/go.mod') != ''
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          cd backend && govulncheck ./...

      # Exact release binary, sha256-verified (osv-scanner has no Dependabot ecosystem; bump per
      # docs/runbooks/dependency-updates.md). Scans lock files only, so it needs no Go/Flutter toolchain state.
      # Fails on ANY finding not listed in osv-scanner.toml (narrow, expiring ignores). Reachability
      # analysis is off: govulncheck above is the reachability gate, and this step must be deterministic.
      - name: osv-scanner (go.mod + pubspec.lock)
        env:
          OSV_SCANNER_VERSION: v2.6.0
          OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
        run: |
          curl -fsSL -o /tmp/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  /tmp/osv-scanner" | sha256sum -c -
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner scan --config=osv-scanner.toml --no-call-analysis=go \
            -L backend/go.mod -L app/pubspec.lock

  emulator-integration:
    name: make test-int (Firebase emulators)
    runs-on: ubuntu-latest
    needs: make-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Latest 1.26 patch (stdlib security fixes); go.mod only states the minimum language version.
          go-version: "1.26.x"
          check-latest: true
          cache: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21" # firebase-tools 15 requires Java >= 21

      - name: Cache Firebase emulator binaries
        # The Firestore/Auth/Pub/Sub/Storage-rules emulators are JARs firebase-tools downloads on first
        # use (testing-strategy skill "CI cost": "cache ... the emulator JARs"). Keyed on the pinned
        # firebase-tools major version below plus firebase.json (the emulators it starts); restore-keys
        # falls back to any cache for this OS/version if firebase.json changes so a config tweak doesn't
        # cost a full re-download.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v15-${{ hashFiles('firebase.json') }}
          restore-keys: |
            firebase-emulators-${{ runner.os }}-v15-

      - name: Install firebase-tools
        run: npm install -g firebase-tools@15.32.0

      - name: make test-int
        if: hashFiles('Makefile') != '' && hashFiles('firebase.json') != ''
        run: make test-int

      - name: (skip) Makefile or firebase.json not present yet
        if: hashFiles('Makefile') == '' || hashFiles('firebase.json') == ''
        run: echo "::warning::Makefile and/or firebase.json not present yet — skipping emulator integration tests."
