name: Promote prod

# Manual, founder-run traffic promotion for a release already staged by
# release-prod.yml (image built, deployed --no-traffic --tag candidate, smoke
# tested). This workflow is workflow_dispatch ONLY — there is no `push`
# trigger, so it never runs automatically.
#
# GitHub Free (private repo) has neither environment required-reviewers nor
# tag rulesets available. The
# founder clicking "Run workflow" and picking a stage IS the human approval;
# there is no second machine-enforced gate beyond:
#   1. the `prod` GitHub Environment's deployment policy (tags matching `v*`
#      only — this workflow declares `environment: prod` on its one job, so
#      GitHub itself refuses to start the job from a branch ref), and
#   2. the checks in this workflow: dispatch must be from a tag ref matching
#      ^v[0-9]+\.[0-9]+\.[0-9]+$, a releases/<tag>-readiness.md
#      with `VERDICT: GO` must exist for that exact tag, and the revision
#      currently holding the `candidate` traffic tag must be provably built from
#      that same tag (not a stale candidate left over from a different release).
# Rule: "Never shift prod traffic without a passing
# production-reviewer verdict" — enforced by the VERDICT: GO check below on
# every run (both the 10% and the 100% stage), since each stage is a
# separate workflow_dispatch run with no `needs:` relationship to the other.
#
# Run this twice per release: once with stage=10, watch dashboards for ~15
# minutes (5xx ratio, p95 latency, Error Reporting), then again with
# stage=100.
#
# Security note (same pattern as release-prod.yml): every `${{ }}` value
# used inside a `run:` block is first assigned to an `env:` var and expanded
# as a shell variable — never spliced directly into a script — so nothing
# derived from workflow inputs/refs can perform script injection against the
# prod-WIF-authenticated steps.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Percentage of traffic to shift to the candidate revision"
        required: true
        type: choice
        options:
          - "10"
          - "100"

permissions:
  contents: read
  id-token: write

concurrency:
  group: promote-prod
  cancel-in-progress: false # never cancel a traffic shift mid-flight

jobs:
  # Third-party Rust build scripts (build.rs and proc-macros of ~200 crates.io crates) run in `make crypto-web`, so that runs here
  # and nowhere near credentials: read-only `contents`, no id-token, no `environment:`, no cloud auth, no secrets. The
  # promote job below (stage 100 only) downloads app/web/mls/ from this job (artifact: mls-web) and checks it against the hash this job outputs.
  crypto-web:
    name: Build the MLS wasm (no credentials)
    # Stage 100 only, and only from a v* tag: a dispatch from a branch (which the promote job refuses anyway) must not spend
    # minutes building. A skipped crypto-web at stage 100 still blocks `promote` (its `if:` below is unchanged), so a stage-100
    # dispatch from a branch now ends with `promote` skipped (neutral) instead of failing at its explicit tag-ref refusal.
    if: github.event.inputs.stage == '100' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      mls_sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust (for the MLS wasm build)
        uses: ./.github/actions/setup-rust
        with:
          version: "1.100.0"
          targets: wasm32-unknown-unknown
          wasm-bindgen: "true"

      - name: make crypto-web
        run: make crypto-web

      - name: Hash the output
        id: hash
        run: |
          set -euo pipefail
          cd app/web/mls
          echo "sha256=$(cat dzmls_web.js dzmls_web_bg.wasm | sha256sum | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mls-web
          path: |
            app/web/mls/dzmls_web.js
            app/web/mls/dzmls_web_bg.wasm
          if-no-files-found: error
          retention-days: 1

  promote:
    name: "Promote candidate (stage=${{ github.event.inputs.stage }})"
    needs: [crypto-web]
    # crypto-web is skipped on purpose for stage 10 only; any other non-success blocks the promotion.
    if: ${{ !cancelled() && (needs.crypto-web.result == 'success' || (needs.crypto-web.result == 'skipped' && github.event.inputs.stage != '100')) }}
    runs-on: ubuntu-latest
    environment: prod # deployment policy restricts this to tag refs matching v* (GitHub Free-compatible)
    steps:
      - name: Validate stage input
        id: stage
        env:
          STAGE_INPUT: ${{ github.event.inputs.stage }}
        run: |
          # workflow_dispatch "choice" inputs are enforced by the GitHub UI
          # form but not necessarily by every API caller — re-check here so a
          # malformed dispatch can't reach the gcloud step below.
          case "${STAGE_INPUT}" in
            10|100) ;;
            *)
              echo "::error::stage must be '10' or '100', got '${STAGE_INPUT}'."
              exit 1
              ;;
          esac
          echo "stage=${STAGE_INPUT}" >> "$GITHUB_OUTPUT"

      - name: Require dispatch from a tag ref, validate the tag
        id: tagname
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "${REF_TYPE}" != "tag" ]; then
            echo "::error::This workflow must be dispatched from a tag ref (got ref_type='${REF_TYPE}', ref_name='${REF_NAME}'). Pick a v* tag under 'Use workflow from', not a branch."
            exit 1
          fi
          tag="${REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${tag}' does not match ^v[0-9]+.[0-9]+.[0-9]+\$ — refusing to promote."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tagname.outputs.tag }}

      - name: Require a recorded production-reviewer GO verdict
        env:
          RELEASE_TAG: ${{ steps.tagname.outputs.tag }}
        run: |
          f="releases/${RELEASE_TAG}-readiness.md"
          if [ ! -f "$f" ]; then
            echo "::error::Missing $f — production-reviewer must record VERDICT: GO before any traffic can shift."
            exit 1
          fi
          # Whole-line match: a NO-GO report that merely mentions the GO string must not pass.
          grep -qx "VERDICT: GO" "$f" || { echo "::error::$f has no line that is exactly 'VERDICT: GO'"; exit 1; }

      - name: Auth to GCP (WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PROD_DEPLOY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PROD_CI_DEPLOY_SA_EMAIL }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          # Exact Cloud SDK pin (issue #46 / L6); bump with the pinned SHA.
          version: "587.0.0"

      - name: Resolve the candidate revision and verify it matches this tag
        id: rc_rev
        env:
          RELEASE_TAG: ${{ steps.tagname.outputs.tag }}
          SERVICE: ${{ vars.PROD_SERVICE_NAME }}
          PROJECT: ${{ vars.PROD_PROJECT_ID }}
          REGION: ${{ vars.PROD_REGION }}
        run: |
          # jq, not a gcloud --format projection: gcloud has no first() transform (verified; it errors).
          revision=$(gcloud run services describe "${SERVICE}" \
            --project="${PROJECT}" --region="${REGION}" \
            --format=json | jq -r '[.status.traffic[]? | select(.tag == "candidate") | .revisionName] | first // empty')
          if [ -z "${revision}" ]; then
            echo "::error::No revision is currently tagged 'candidate' on ${SERVICE}. Run release-prod.yml for ${RELEASE_TAG} first."
            exit 1
          fi

          image=$(gcloud run revisions describe "${revision}" \
            --project="${PROJECT}" --region="${REGION}" \
            --format='value(spec.containers[0].image)')
          if [ -z "${image}" ]; then
            echo "::error::Could not resolve the container image for revision ${revision}."
            exit 1
          fi

          # release-prod.yml pushes the image with `ko build -t "${RELEASE_TAG}"`, so
          # <repo>/api:<RELEASE_TAG> is a real Artifact Registry tag. Cloud Run pins a
          # revision to a digest (repo/api@sha256:...). Proving "the revision behind the candidate tag
          # was built from this git tag" = the digest the release tag points to equals
          # the revision's digest. This catches a stale candidate left over from a different
          # release (the `candidate` traffic tag moves on every release-prod run).
          # (`gcloud artifacts docker tags list <image@digest>` returns NOT_FOUND and
          # reports tags as full resource paths, so it can't be used for this; verified.)
          repo_image="${image%@*}"
          rev_digest=$(gcloud artifacts docker images describe "${image}" --format='value(image_summary.digest)')
          tag_digest=$(gcloud artifacts docker images describe "${repo_image}:${RELEASE_TAG}" --format='value(image_summary.digest)' || true)
          if [ -z "${rev_digest}" ] || [ "${rev_digest}" != "${tag_digest}" ]; then
            echo "::error::candidate revision '${revision}' (${rev_digest:-unknown digest}) is not the image tagged '${RELEASE_TAG}' (${tag_digest:-tag not found}); the candidate tag points at a different release. Re-run release-prod.yml for ${RELEASE_TAG}, then retry this promotion."
            exit 1
          fi

          echo "revision=${revision}" >> "$GITHUB_OUTPUT"
          echo "Verified candidate revision ${revision} (image ${image}) matches tag ${RELEASE_TAG}"

      # Deliberately no `working-directory:` here — firebase-tools reads
      # firebase.json from the step's cwd with no upward directory search, so
      # this must run from $GITHUB_WORKSPACE (repo root), which is where the
      # real firebase.json (firestore/hosting config) lives. app/firebase.json
      # is a separate, flutterfire-generated file that only has a "flutter"
      # key — running from app/ would silently no-op or fail.
      #
      # Security audit L5: this MUST run before either traffic shift below
      # (stage 10 or 100), not just before stage 100 — indexes have to be
      # READY before the candidate revision serves any live traffic, not only before
      # it serves all of it. release-prod.yml already deployed the same
      # rules/indexes for this tag before staging the candidate revision, so this is
      # normally a fast, idempotent no-op; it's a safety net if promotion
      # happens before that had time to finish building, or if rules/indexes
      # changed since (they shouldn't, for a tag that's already built).
      - name: Deploy Firestore rules + indexes (must be READY before any traffic shifts)
        env:
          FIREBASE_PROJECT_ID: ${{ vars.PROD_PROJECT_ID }}
        run: |
          npm install -g firebase-tools@15.32.0
          firebase deploy --only firestore:rules,firestore:indexes \
            --project "${FIREBASE_PROJECT_ID}" --non-interactive

      - name: Wait for Firestore indexes to be READY (before promotion)
        timeout-minutes: 12
        env:
          PROJECT: ${{ vars.PROD_PROJECT_ID }}
        run: bash scripts/promotion/wait-firestore-indexes.sh "$PROJECT"

      - name: Shift 10% traffic to the verified revision
        if: steps.stage.outputs.stage == '10'
        env:
          SERVICE: ${{ vars.PROD_SERVICE_NAME }}
          PROJECT: ${{ vars.PROD_PROJECT_ID }}
          REGION: ${{ vars.PROD_REGION }}
          REVISION: ${{ steps.rc_rev.outputs.revision }}
        run: |
          gcloud run services update-traffic "${SERVICE}" \
            --project="${PROJECT}" \
            --region="${REGION}" \
            --to-revisions="${REVISION}=10"

      - name: Watch reminder
        if: steps.stage.outputs.stage == '10'
        env:
          REVISION: ${{ steps.rc_rev.outputs.revision }}
        run: |
          echo "::notice::10% of traffic is now on ${REVISION}. Watch 5xx ratio, p95 latency and Error Reporting for ~15 minutes, then re-run this workflow with stage=100."

      - name: Setup Flutter
        if: steps.stage.outputs.stage == '100'
        uses: ./.github/actions/setup-flutter
        with:
          version: "3.50.0"
          sha: ab2912035e160d9cad6306df307576da6128ebdb

      # app/web/mls/ is gitignored and the web bundle copies web/ at build time: bring in the wasm built by the credential-free job.
      - name: Download the MLS wasm
        if: steps.stage.outputs.stage == '100'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mls-web
          path: app/web/mls

      - name: Check the MLS wasm (present and the hash the build job reported)
        if: steps.stage.outputs.stage == '100'
        env:
          EXPECTED_SHA256: ${{ needs.crypto-web.outputs.mls_sha256 }}
        run: |
          set -euo pipefail
          for f in dzmls_web.js dzmls_web_bg.wasm; do
            [ -s "app/web/mls/$f" ] || { echo "::error::app/web/mls/$f is missing or empty: the crypto-web job did not hand over the MLS wasm"; exit 1; }
          done
          actual=$(cd app/web/mls && cat dzmls_web.js dzmls_web_bg.wasm | sha256sum | cut -d' ' -f1)
          if [ -z "$EXPECTED_SHA256" ] || [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::the downloaded MLS wasm does not match the hash the crypto-web job reported"
            exit 1
          fi

      - name: flutter build web (prod) — built fresh from this tag, before any traffic shift
        if: steps.stage.outputs.stage == '100'
        working-directory: app
        env:
          # Web calls the API via the Firebase Hosting `/api/**` rewrite, not
          # the raw Cloud Run URL — same-origin, no CORS needed.
          API_BASE_URL: /api
          RECAPTCHA_SITE_KEY: ${{ vars.PROD_RECAPTCHA_SITE_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.PROD_GOOGLE_WEB_CLIENT_ID }}
        run: |
          flutter build web --release \
            --dart-define=USE_EMULATORS=false \
            --dart-define=FIREBASE_ENV=prod \
            --dart-define=API_BASE_URL="${API_BASE_URL}" \
            --dart-define=RECAPTCHA_SITE_KEY="${RECAPTCHA_SITE_KEY}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${GOOGLE_WEB_CLIENT_ID}"

      - name: Shift 100% traffic to the verified revision
        if: steps.stage.outputs.stage == '100'
        env:
          SERVICE: ${{ vars.PROD_SERVICE_NAME }}
          PROJECT: ${{ vars.PROD_PROJECT_ID }}
          REGION: ${{ vars.PROD_REGION }}
          REVISION: ${{ steps.rc_rev.outputs.revision }}
        run: |
          # --to-revisions (not --to-latest): --to-latest would also send
          # traffic to any revision deployed after this one (e.g. if
          # release-prod already ran again for a newer tag), which is not
          # what a promotion of THIS tag means.
          gcloud run services update-traffic "${SERVICE}" \
            --project="${PROJECT}" \
            --region="${REGION}" \
            --to-revisions="${REVISION}=100"

      - name: Smoke test the service URL (/health)
        if: steps.stage.outputs.stage == '100'
        env:
          SERVICE: ${{ vars.PROD_SERVICE_NAME }}
          PROJECT: ${{ vars.PROD_PROJECT_ID }}
          REGION: ${{ vars.PROD_REGION }}
        run: |
          url=$(gcloud run services describe "${SERVICE}" \
            --project="${PROJECT}" --region="${REGION}" \
            --format='value(status.url)')
          curl -fsS --retry 5 --retry-delay 5 "${url}/health"

      # Deliberately no `working-directory:` here (unlike the flutter build
      # step above, which needs `working-directory: app`) — firebase-tools
      # reads firebase.json from the step's cwd with no upward directory
      # search, so this must run from $GITHUB_WORKSPACE (repo root), where
      # the real firebase.json (hosting.public: app/build/web) lives.
      # app/firebase.json is a separate, flutterfire-generated file that only
      # has a "flutter" key — running this from app/ would fail with "No
      # targets in firebase.json match". firebase-tools is already installed
      # by the rules/indexes step above, in the same job.
      #
      # Hosting only (security audit L5): Firestore rules/indexes were
      # already deployed above, before any traffic moved. Hosting itself is
      # deliberately never deployed before the 100% stage.
      - name: Deploy web (Firebase Hosting, prod)
        if: steps.stage.outputs.stage == '100'
        env:
          FIREBASE_PROJECT_ID: ${{ vars.PROD_PROJECT_ID }}
        run: |
          firebase deploy --only hosting \
            --project "${FIREBASE_PROJECT_ID}" --non-interactive

      - name: Rollback command (if this promotion needs to be undone)
        if: failure()
        env:
          SERVICE: ${{ vars.PROD_SERVICE_NAME }}
          PROJECT: ${{ vars.PROD_PROJECT_ID }}
          REGION: ${{ vars.PROD_REGION }}
        run: |
          echo "::error::Promotion failed."
          echo "::warning::Do not roll back past the first release that enforces reply audience once FEATURE_REPLY_AUDIENCE has left off (ADR-0021). Roll forward with a fix instead."
          echo "gcloud run services update-traffic ${SERVICE} --project=${PROJECT} --region=${REGION} --to-revisions=<previous-stable-revision>=100"
