# Dependabot version updates (free). Closes the v0.1.0 risk acceptances L6/L7.
# Weekly, grouped minor+patch, small open-PR cap so review load stays bounded.
# Majors are never grouped: each one arrives as its own PR for deliberate review.
version: 2
updates:
  # Go module lives in backend/ (no go.work at the repo root).
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels: [dependencies, go]
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        update-types: [minor, patch]
        # firebase-admin-go comes as its own PR: 4.23.0 changed App Check client construction (ADC at init, client
        # rebuilt on later calls) and fails the authn fail-closed tests, so it waits for an App Check review without
        # blocking the rest of the group. Drop this exclusion once 4.23+ is adopted.
        exclude-patterns:
          - "firebase.google.com/go/*"

  # Flutter app: pubspec.yaml is at app/pubspec.yaml.
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels: [dependencies, flutter]
    commit-message:
      prefix: "chore(deps)"
    # Firebase SDK majors (core 5, auth 7, messaging 17, ...) are held: they need a planned upgrade with an
    # Android/iOS build and an on-device push check (firebase_messaging 17 deprecates getToken/onTokenRefresh/
    # deleteToken). Remove this block when doing that upgrade. Minor and patch Firebase updates still arrive.
    ignore:
      - dependency-name: "firebase_*"
        update-types: ["version-update:semver-major"]
      # firebase_app_check is still 0.x, so its breaking releases are "minor" (0.4 -> 0.5 needs firebase_core 5 and
      # dragged the whole Firebase major bump in through #672). Hold those too, with the rest of the upgrade.
      - dependency-name: "firebase_app_check"
        update-types: ["version-update:semver-minor"]
    groups:
      # build_runner and freezed move together in their own PR: build_runner 2.17 and freezed 4.0.3 need analyzer
      # ^14.3, which the pinned Flutter SDK (flutter_test -> test_api) and bloc_test cannot resolve yet. Kept apart
      # so they fail alone instead of blocking pub-minor-patch; fold back in after the Flutter SDK upgrade.
      dart-codegen:
        patterns: [build_runner, freezed]
        update-types: [minor, patch]
      pub-minor-patch:
        update-types: [minor, patch]
        exclude-patterns: [build_runner, freezed]

  # Keeps the SHA pins in .github/workflows current (the version comment is updated too).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # Terraform providers: both env roots plus every module (each has its own versions.tf).
  - package-ecosystem: terraform
    directories:
      - /infra/terraform/envs/dev
      - /infra/terraform/envs/prod
      - /infra/terraform/modules/*
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels: [dependencies, terraform]
    commit-message:
      prefix: "chore(deps)"
    groups:
      terraform-minor-patch:
        update-types: [minor, patch]
