# Dependabot version updates (free). Closes the v0.1.0 risk acceptances L6/L7.
# Weekly, grouped minor+patch, small open-PR cap so review load stays bounded.
# Majors are never grouped: each one arrives as its own PR for deliberate review.
version: 2
updates:
  # Go module lives in backend/ (no go.work at the repo root).
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels: [dependencies, go]
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  # Flutter app: pubspec.yaml is at app/pubspec.yaml.
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels: [dependencies, flutter]
    commit-message:
      prefix: "chore(deps)"
    # Firebase SDK majors (core 5, auth 7, messaging 17, ...) are held: they need a planned upgrade with an
    # Android/iOS build and an on-device push check (firebase_messaging 17 deprecates getToken/onTokenRefresh/
    # deleteToken). Remove this block when doing that upgrade. Minor and patch Firebase updates still arrive.
    ignore:
      - dependency-name: "firebase_*"
        update-types: ["version-update:semver-major"]
    groups:
      pub-minor-patch:
        update-types: [minor, patch]

  # Keeps the SHA pins in .github/workflows current (the version comment is updated too).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # Terraform providers: both env roots plus every module (each has its own versions.tf).
  - package-ecosystem: terraform
    directories:
      - /infra/terraform/envs/dev
      - /infra/terraform/envs/prod
      - /infra/terraform/modules/*
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels: [dependencies, terraform]
    commit-message:
      prefix: "chore(deps)"
    groups:
      terraform-minor-patch:
        update-types: [minor, patch]
