name: dzeroth
description: "dZeroth - text-first social app (Phase 0 shell)."
publish_to: 'none' # Private app, not published to pub.dev.

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Navigation
  go_router: ^18.0.2

  # Generated Connect-RPC / protobuf client (app/lib/gen) runtime deps
  connectrpc: ^2.0.0
  protobuf: ^6.1.0
  fixnum: ^1.1.1

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_app_check: ^0.4.8
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.7

  # Media / images
  cached_network_image: ^3.4.1

  # Local cache (offline-first)
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1

  # Utilities
  uuid: ^4.6.0
  intl: ^0.20.2
  logging: ^1.3.0
  stream_transform: ^2.1.2
  url_launcher: ^6.3.2
  # NFC for the composer's code-point counter (ADR-0010 D9 step 3). Pure Dart.
  unorm_dart: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  drift_dev: ^2.35.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  # Fakes UrlLauncherPlatform.instance in privacy_policy_link_test.dart so
  # tests never hit a real platform channel.
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
