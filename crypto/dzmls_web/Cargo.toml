[package]
name = "dzmls_web"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
description = "Hand-written single-threaded wasm-bindgen binding over dzmls, for the Flutter web worker."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dzmls = { path = "../dzmls" }
wasm-bindgen = "=0.2.130"
js-sys = "=0.3.107"

# getrandom needs an explicit browser backend on wasm32-unknown-unknown: 0.4 through the `wasm_js` feature plus the
# cfg in ../.cargo/config.toml, 0.2 (the RustCrypto stack) through its `js` feature.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "=0.4.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "=0.2.17", features = ["js"] }

[dev-dependencies]
serde_json = "=1.0.154"
wasm-bindgen-test = "=0.3.80"
