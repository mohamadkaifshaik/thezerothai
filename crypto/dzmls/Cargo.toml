[package]
name = "dzmls"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
description = "Dzeroth MLS (RFC 9420) core: pure functions over opaque state blobs, wrapping OpenMLS."

[dependencies]
# AES-256-GCM for locally sealed values. Its zeroize feature also enables aes/zeroize.
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
# OpenMLS still uses the older crates. Preserve key erasure on its dependency graph as well.
aes-openmls = { package = "aes", version = "=0.8.4", default-features = false, features = ["zeroize"] }
aes-gcm-openmls = { package = "aes-gcm", version = "=0.10.3", default-features = false, features = ["zeroize"] }
openmls = "=0.9.2"
openmls_basic_credential = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
serde_json = { version = "=1.0.154", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
openmls = { version = "=0.9.2", features = ["js"] }

[features]
# The test-vector generator (`dzmls_vectors`) is not part of a plain library build (wasm, mobile).
vectors = ["dep:serde_json"]

[dev-dependencies]
serde_json = "=1.0.154"

[[bin]]
name = "dzmls_vectors"
path = "src/bin/dzmls_vectors.rs"
required-features = ["vectors"]
